<html lang="en">
<head>

<body>

<div id="app"></div>
<noscript>This page needs JavaScript to show its content.</noscript>

<!-- The words come from the T list in js/learn.js, so this one page serves English and Arabic (learn.html?lang=ar).
     Views: home (dashboard), course (its lessons), lesson (learn, questions, result) and report (family report). -->
<template id="page">
<div class="{{ shellCls }}">

<!-- SIDEBAR (top bar on small screens; hidden while a lesson is playing) -->
<aside class="side no-print">
<a class="brand" href="{{ siteHref }}">
<span class="brand-mark"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M24 8L42 40H6z" fill="#B3261E" stroke="#B3261E" stroke-width="3"/><path d="M19.5 16h9l1.7 3H17.8z" fill="#FFFFFF"/><path d="M16.1 22h15.8l1.7 3H14.4z" fill="#FFFFFF"/><circle cx="19.5" cy="31" r="1.6" fill="#FFFFFF"/><circle cx="28.5" cy="31" r="1.6" fill="#FFFFFF"/><path d="M19 35q5 4 10 0" stroke="#FFFFFF" stroke-width="2.2"/></svg></span>
<span class="brand-name">{{ t.brand }}</span>
</a>
<nav class="side-nav" aria-label="Main">
<button type="button" onclick="{{ goJourney }}" aria-current="{{ journeyOn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg><span>{{ t.navJourney }}</span></button>
<button type="button" onclick="{{ goHome }}" aria-current="{{ homeOn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg><span>{{ t.navHome }}</span></button>
<button type="button" onclick="{{ goReport }}" aria-current="{{ reportOn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 21h16M7 17v-5M12 17V6M17 17v-8"/></svg><span>{{ t.navReport }}</span></button>
<button type="button" onclick="{{ goStories }}" aria-current="{{ storiesOn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 6c-2-1.6-5-2-8-1.5v14c3-.5 6-.1 8 1.5 2-1.6 5-2 8-1.5v-14c-3-.5-6-.1-8 1.5zM12 6v14"/></svg><span>{{ t.navStories }}</span></button>
<button type="button" onclick="{{ goStickers }}" aria-current="{{ stickersOn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h10l4 4v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM15 3v4h4"/><circle cx="10" cy="13" r="3"/></svg><span>{{ t.navStickers }}</span></button>
<button type="button" onclick="{{ goHouse }}" aria-current="{{ houseOn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10M10 20v-5h4v5"/></svg><span>{{ t.navHouse }}</span></button>
<button type="button" onclick="{{ goToday }}" aria-current="{{ todayOn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M9 15l2 2 4-4"/></svg><span>{{ t.navToday }}</span></button>
<button type="button" onclick="{{ goPet }}" aria-current="{{ petOn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3c-4 0-7 5-7 10a7 7 0 0 0 14 0c0-5-3-10-7-10z"/><path d="M9 13l2 2 2-2 2 2"/></svg><span>{{ t.navPet }}</span></button>
<button type="button" onclick="{{ goDisc }}" aria-current="{{ discOn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span>{{ t.navDisc }}</span></button>
<button type="button" onclick="{{ goWard }}" aria-current="{{ wardOn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 6a2 2 0 1 1 2 2c-1 0-2 .8-2 2l9 6c.8.6.4 2-.6 2H3.6c-1 0-1.4-1.4-.6-2l9-6"/></svg><span>{{ t.navWard }}</span></button>
<button type="button" onclick="{{ goVibe }}" aria-current="{{ vibeOn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 11v3M6.5 12.5h3M15 12h.01M17 14h.01"/></svg><span>{{ t.navVibe }}</span></button>
<button type="button" onclick="{{ goAI }}" aria-current="{{ aiOn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16.5h5"/></svg><span>{{ t.navAI }}</span></button>
<a href="{{ bayHref }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 15c2 1.5 4 1.5 6 0s4-1.5 6 0 4 1.5 6 0M5 11l2-6h10l2 6z"/></svg><span>{{ t.navBay }}</span></a>
<a href="{{ gamesHref }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg><span>{{ t.navGames }}</span></a>
<a href="{{ langHref }}" class="lang"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span>{{ t.langLabel }}</span></a>
</nav>
<div class="side-foot">
<button type="button" class="who" onclick="{{ goWho }}" title="{{ t.switchChild }}"><span class="avatar" aria-hidden="true"><sc-if value="{{ hasPhoto }}"><img src="{{ photo }}" alt=""></sc-if><sc-if value="{{ noPhoto }}">{{ initial }}</sc-if></span><span class="who-name"><b>{{ childName }}</b><span class="small">{{ t.switchChild }}</span></span></button>
<p>{{ t.savedHere }}</p>
</div>
</aside>

<main class="main" id="main" tabindex="-1">

<!-- HOME: dashboard -->
<sc-if value="{{ isHome }}">
<section class="page">
<header class="greet">
<label class="me" title="{{ photoBtn }}">
<input type="file" accept="image/*" class="file" onchange="{{ setPhoto }}">
<sc-if value="{{ hasPhoto }}"><img src="{{ photo }}" alt="{{ childName }}"></sc-if>
<sc-if value="{{ noPhoto }}"><span class="me-empty"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>{{ t.photoAdd }}</span></span></sc-if>
</label>
<div class="page-head">
<p class="eyebrow">{{ dash.date }}</p>
<h1 class="h1">{{ dash.hello }}</h1>
<p class="lead">{{ t.homeIntro }}</p>
</div>
</header>

<sc-if value="{{ ageInfo.picking }}">
<div class="card age-card">
<h2 class="h3">{{ t.agePick }}</h2>
<p class="small muted">{{ t.ageIntro }}</p>
<div class="age-row"><sc-for list="{{ ageInfo.choices }}" as="a"><button type="button" class="{{ a.cls }}" onclick="{{ a.set }}" aria-pressed="{{ a.pressed }}">{{ a.label }}</button></sc-for>
<button type="button" class="btn ghost" onclick="{{ ageInfo.all }}">{{ t.ageAll }}</button></div>
</div>
</sc-if>
<div class="guide">
<button type="button" class="saqr-btn" onclick="{{ dash.saqrTap }}" aria-label="{{ t.tapSaqr }}" title="{{ t.tapSaqr }}"><svg class="{{ dash.saqrCls }}" viewBox="0 0 120 120" aria-hidden="true"><use href="#saqr"/></svg></button>
<div class="bubble" aria-live="polite"><p>{{ dash.guide }}</p><sc-if value="{{ speakOk }}"><button type="button" class="speak" onclick="{{ dash.say }}" aria-label="{{ t.listenBtn }}" title="{{ t.listenBtn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button></sc-if></div>
</div>

<div class="dash-top">
<article class="hero" style="--c: {{ dash.color }}; --t: {{ dash.tint }}">
<svg class="band" aria-hidden="true" width="100%" height="14"><defs><pattern id="heroband" width="28" height="14" patternUnits="userSpaceOnUse"><path d="M0 14L7 2l7 12z" fill="#B3261E"/><path d="M14 14L21 2l7 12z" fill="#23204A"/></pattern></defs><rect width="100%" height="14" fill="url(#heroband)"/></svg>
<div class="hero-body">
<div class="hero-text">
<p class="eyebrow">{{ dash.label }}</p>
<h2 class="h2">{{ dash.title }}</h2>
<p class="meta"><span class="tag">{{ dash.course }}</span> {{ dash.of }} · {{ t.lessonMeta }}</p>
<button type="button" class="btn primary lg" onclick="{{ dash.start }}">{{ dash.btn }}<svg class="flip" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>
<div class="hero-art" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="{{ dash.icon }}"/></svg></div>
</div>
</article>

<article class="card week">
<div class="week-head">
<h2 class="h3">{{ t.thisWeek }}</h2>
<span class="streak"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2.5c.6 3.4 4.8 5.6 4.8 10.3a4.8 4.8 0 0 1-9.6 0c0-2.1 1-3.6 2.2-4.6.1 1.6.9 2.7 2 3 0-3.2-.7-5.6.6-8.7z"/></svg><b>{{ dash.streak }}</b> {{ t.streak }}</span>
</div>
<div class="wk-row" dir="ltr">
<sc-for list="{{ dash.week }}" as="w">
<div class="{{ w.cls }}"><div class="wk-track"><div class="{{ w.bar }}" style="height: {{ w.h }}"></div></div><span>{{ w.label }}</span></div>
</sc-for>
</div>
<div class="goal-box">
<div class="{{ dash.goal.ringCls }}" aria-hidden="true"><svg viewBox="0 0 44 44"><circle class="ring-bg" cx="22" cy="22" r="18"/><circle class="ring-fg" cx="22" cy="22" r="18" stroke-dasharray="{{ dash.goal.dash }}" transform="rotate(-90 22 22)"/></svg><span>🎯</span></div>
<div class="goal-text">
<b>{{ t.goalTitle }}</b>
<span class="small">{{ dash.goal.text }}</span>
<sc-if value="{{ dash.goal.done }}"><span class="small goal-ok">{{ t.goalDone }}</span></sc-if>
<div class="goal-pick"><span class="small muted">{{ t.goalPick }}</span><sc-for list="{{ dash.goal.choices }}" as="g"><button type="button" class="{{ g.cls }}" onclick="{{ g.set }}" aria-pressed="{{ g.pressed }}">{{ g.label }}</button></sc-for></div>
</div>
</div>
</article>
</div>

<div class="stats">
<div class="stat"><span class="stat-ic" style="background: #DDF3E6; color: #0B6B3A"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></span><div><b dir="ltr">{{ total.done }}<small> / {{ total.lessons }}</small></b><span>{{ t.sLessons }}</span></div></div>
<div class="stat"><span class="stat-ic" style="background: #FFF1C7; color: #8A5A00"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg></span><div><b dir="ltr">{{ total.stars }}<small> / {{ total.starsMax }}</small></b><span>{{ t.sStars }}</span></div></div>
<div class="stat"><span class="stat-ic" style="background: #DCEEFD; color: #145E96"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div><b>{{ dash.minutes }}</b><span>{{ t.sMinutes }}</span></div></div>
<div class="stat"><span class="stat-ic" style="background: #FFE1EC; color: #A3245A"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5"/></svg></span><div><b dir="ltr">{{ dash.started }}<small> / {{ dash.courseCount }}</small></b><span>{{ t.sCourses }}</span></div></div>
</div>


<sc-if value="{{ review.has }}"><div class="review-offer"><span class="review-ic" aria-hidden="true">🔁</span><p>{{ review.text }}</p><button type="button" class="btn accent" onclick="{{ review.start }}">{{ t.rvBtn }}</button></div></sc-if>
<article class="card sticker-card">
<div class="sticker-card-text"><h2 class="h3">{{ t.stickerTitle }}</h2><span class="small muted">{{ stickers.count }}</span>
<div class="bar"><span style="width: {{ stickers.pct }}"></span></div></div>
<div class="sticker-strip" aria-hidden="true"><sc-for list="{{ stickers.recent }}" as="r"><span class="sticker mini">{{ r.s }}</span></sc-for><sc-if value="{{ stickers.noRecent }}"><span class="sticker mini locked">⭐</span><span class="sticker mini locked">🐪</span><span class="sticker mini locked">🌴</span></sc-if></div>
<button type="button" class="btn secondary" onclick="{{ goStickers }}">{{ t.openStickers }}</button>
</article>

<article class="card plan">
<div class="plan-head">
<div class="page-head" style="gap: 4px">
<h2 class="h2">{{ t.planTitle }}</h2>
<p class="muted">{{ plan.summary }}</p>
</div>
<button type="button" class="btn ghost" onclick="{{ goReport }}">{{ t.planSee }}</button>
</div>
<sc-if value="{{ plan.any }}">
<div class="levels">
<sc-for list="{{ plan.levels }}" as="lv"><div class="level" style="--c: {{ lv.color }}"><div class="level-top"><b>{{ lv.name }}</b><span class="level-score" dir="ltr">{{ lv.score }}</span></div><span class="{{ lv.badge }}">{{ lv.label }}</span></div></sc-for>
</div>
</sc-if>
<sc-if value="{{ plan.hasSteps }}">
<ol class="plan-steps">
<sc-for list="{{ plan.short }}" as="st">
<li class="pstep" style="--c: {{ st.color }}">
<span class="pstep-num" aria-hidden="true">{{ st.num }}</span>
<div class="pstep-main">
<b>{{ st.title }}</b>
<span class="why">{{ st.why }}</span>
<sc-if value="{{ st.hasMissed }}"><div class="focus-items"><span class="small muted" style="background: none; padding: 0">{{ t.stMissed }}</span><sc-for list="{{ st.missed }}" as="m"><span dir="auto">{{ m }}</span></sc-for></div></sc-if>
</div>
<button type="button" class="btn secondary" onclick="{{ st.go }}">{{ t.planGo }}</button>
</li>
</sc-for>
</ol>
</sc-if>
</article>

<div class="section-head">
<h2 class="h2">{{ ageInfo.heading }}</h2>
<sc-if value="{{ ageInfo.notPicking }}"><button type="button" class="age-chip" onclick="{{ ageInfo.open }}">{{ ageInfo.chip }} · {{ t.ageChange }}</button></sc-if>
</div>
<sc-if value="{{ ageInfo.over10 }}"><p class="small muted">{{ t.ageNote10 }}</p></sc-if>
<div class="course-grid">
<sc-for list="{{ coursesFit }}" as="c">
<article class="ccard" style="--c: {{ c.color }}; --t: {{ c.tint }}">
<div class="ccard-top">
<span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="{{ c.icon }}"/></svg></span>
<div class="ring" role="img" aria-label="{{ c.name }}: {{ c.masteryText }}"><svg aria-hidden="true" viewBox="0 0 44 44"><circle class="ring-bg" cx="22" cy="22" r="18"/><circle class="ring-fg" cx="22" cy="22" r="18" stroke-dasharray="{{ c.dash }}" transform="rotate(-90 22 22)"/></svg><span dir="ltr">{{ c.mPct }}</span></div>
</div>
<h3 class="h3">{{ c.name }}</h3>
<p class="small muted">{{ c.age }}</p>
<div class="ccard-meta"><span>{{ c.doneText }}</span><span class="st"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>{{ c.starsText }}</span></div>
<button type="button" class="btn secondary" onclick="{{ c.open }}">{{ c.cta }}</button>
</article>
</sc-for>
<article class="ccard promo">
<div class="ccard-top"><span class="tile" aria-hidden="true" style="background: #B9A8FF"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg></span></div>
<h3 class="h3">{{ t.gamesTitle }}</h3>
<p class="small">{{ t.gamesText }}</p>
<a class="btn accent" href="{{ gamesHref }}">{{ t.gamesBtn }}</a>
</article>
</div>
<sc-if value="{{ hasOther }}">
<div class="section-head"><h2 class="h3">{{ t.otherAges }}</h2></div>
<div class="course-grid other">
<sc-for list="{{ coursesOther }}" as="c">
<article class="ccard" style="--c: {{ c.color }}; --t: {{ c.tint }}">
<div class="ccard-top">
<span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="{{ c.icon }}"/></svg></span>
<div class="ring" role="img" aria-label="{{ c.name }}: {{ c.masteryText }}"><svg aria-hidden="true" viewBox="0 0 44 44"><circle class="ring-bg" cx="22" cy="22" r="18"/><circle class="ring-fg" cx="22" cy="22" r="18" stroke-dasharray="{{ c.dash }}" transform="rotate(-90 22 22)"/></svg><span dir="ltr">{{ c.mPct }}</span></div>
</div>
<h3 class="h3">{{ c.name }}</h3>
<p class="small muted">{{ c.age }}</p>
<div class="ccard-meta"><span>{{ c.doneText }}</span><span class="st"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>{{ c.starsText }}</span></div>
<button type="button" class="btn secondary" onclick="{{ c.open }}">{{ c.cta }}</button>
</article>
</sc-for>
</div>
</sc-if>

<div class="section-head">
<h2 class="h2">{{ t.storiesTitle }}</h2>
<span class="muted small">{{ storiesRead }}</span>
</div>
<div class="story-grid">
<sc-for list="{{ stories }}" as="sc">
<article class="scard" style="--c: {{ sc.color }}; --t: {{ sc.tint }}">
<svg class="scene" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="240" fill="{{ sc.cover.sky }}"/><sc-for list="{{ sc.cover.props }}" as="pp"><use href="{{ pp.href }}" x="{{ pp.x }}" y="{{ pp.y }}" width="{{ pp.w }}" height="{{ pp.h }}" transform="{{ pp.tf }}"/></sc-for></svg>
<div class="scard-body">
<h3 class="h3">{{ sc.title }}</h3>
<span class="stars" role="img" aria-label="{{ sc.starsText }}"><sc-for list="{{ sc.stars }}" as="s"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="{{ s.fill }}"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg></sc-for></span>
<button type="button" class="btn secondary" onclick="{{ sc.open }}">{{ sc.btn }}</button>
</div>
</article>
</sc-for>
</div>
</section>
</sc-if>

<!-- JOURNEY: the child walks a road of lessons; Saqr explains what to do -->
<sc-if value="{{ isJourney }}">
<section class="page journey">
<header class="page-head">
<h1 class="h1">{{ t.jTitle }}</h1>
<p class="lead">{{ t.jIntro }}</p>
</header>
<div class="guide lead-guide">
<svg class="saqr cheer" viewBox="0 0 120 120" role="img" aria-label="{{ t.guide }}"><use href="#saqr"/></svg>
<div class="bubble" aria-live="polite"><p>{{ journey.lead }}</p>
<sc-if value="{{ speakOk }}"><button type="button" class="speak" onclick="{{ journey.say }}" aria-label="{{ t.listenBtn }}" title="{{ t.listenBtn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button></sc-if>
</div>
<sc-if value="{{ journey.hasNext }}"><button type="button" class="btn primary lg point go-btn" onclick="{{ journey.go }}">{{ t.jGo }}</button></sc-if>
</div>
<sc-if value="{{ review.has }}"><div class="review-offer"><span class="review-ic" aria-hidden="true">🔁</span><p>{{ review.text }}</p><button type="button" class="btn accent" onclick="{{ review.start }}">{{ t.rvBtn }}</button></div></sc-if>
<sc-if value="{{ placeOffer }}"><div class="review-offer pl-offer"><span class="review-ic" aria-hidden="true">🎯</span><p>{{ t.plOffer }}</p><div class="actions"><button type="button" class="btn accent" onclick="{{ placeStart }}">{{ t.plStart }}</button><button type="button" class="btn ghost" onclick="{{ placeSkip }}">{{ t.plSkip }}</button></div></div></sc-if>
<sc-if value="{{ journey.hasEarlier }}"><p class="small muted road-earlier">✓ {{ journey.earlier }}</p></sc-if>
<ol class="road">
<sc-for list="{{ journey.stops }}" as="st">
<li class="{{ st.cls }}" style="--c: {{ st.color }}; --t: {{ st.tint }}">
<span class="decor" aria-hidden="true">{{ st.decor }}</span>
<div class="stop-body">
<sc-if value="{{ st.isCurrent }}"><div class="hero-me"><span class="me-av" aria-hidden="true"><sc-if value="{{ hasPhoto }}"><img src="{{ photo }}" alt=""></sc-if><sc-if value="{{ noPhoto }}">{{ initial }}</sc-if></span><span class="you">{{ t.jYou }}</span></div></sc-if>
<button type="button" class="stop-btn" onclick="{{ st.tap }}" aria-disabled="{{ st.dis }}" aria-label="{{ st.num }}. {{ st.title }} · {{ st.course }}">
<svg aria-hidden="true" viewBox="0 0 24 24"><path d="{{ st.icon }}"/></svg>
<span class="stop-num">{{ st.num }}</span>
<sc-if value="{{ st.isDone }}"><span class="stop-tick" aria-hidden="true">✓</span></sc-if>
</button>
<b class="stop-title">{{ st.title }}</b>
<span class="small muted">{{ st.course }}</span>
<sc-if value="{{ st.isDone }}"><span class="stars" aria-hidden="true"><sc-for list="{{ st.stars }}" as="s"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{ s.fill }}"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg></sc-for></span></sc-if>
</div>
</li>
</sc-for>
</ol>
</section>
</sc-if>

<!-- WEEK: a printable summary of the last 7 days for parents -->
<sc-if value="{{ isWeek }}">
<section class="page week-page">
<div class="actions no-print"><button type="button" class="back" onclick="{{ week.back }}"><svg class="flip" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>{{ t.rTitle }}</button><button type="button" class="btn primary" onclick="{{ week.print }}">{{ t.print }}</button></div>
<header class="page-head">
<p class="eyebrow">{{ week.range }}</p>
<h1 class="h1">📅 {{ t.wkTitle }} <span class="muted wk-who">{{ week.who }}</span></h1>
</header>
<div class="stats">
<div class="stat"><span class="stat-ic" style="background: #DDF3E6; color: #0B6B3A"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></span><div><b>{{ week.lessons }}</b><span>{{ t.wkLessons }}</span></div></div>
<div class="stat"><span class="stat-ic" style="background: #DCEEFD; color: #145E96"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div><b>{{ week.minutes }}</b><span>{{ t.wkMinutes }}</span></div></div>
<div class="stat"><span class="stat-ic" style="background: #FFE7D9; color: #9A3412"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><div><b dir="ltr">{{ week.days }}</b><span>{{ t.wkDays }}</span></div></div>
<div class="stat"><span class="stat-ic" style="background: #FFF1C7; color: #8A5A00"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 6c-2-1.6-5-2-8-1.5v14c3-.5 6-.1 8 1.5 2-1.6 5-2 8-1.5v-14c-3-.5-6-.1-8 1.5zM12 6v14"/></svg></span><div><b>{{ week.stories }}</b><span>{{ t.wkStories }}</span></div></div>
</div>
<div class="card">
<h2 class="h3 card-title">{{ t.wkByDay }}</h2>
<div class="wk-row week-bars" dir="ltr"><sc-for list="{{ week.bars }}" as="w"><div class="{{ w.cls }}"><b class="small">{{ w.n }}</b><div class="wk-track"><div class="{{ w.bar }}" style="height: {{ w.h }}"></div></div><span>{{ w.label }}</span></div></sc-for></div>
</div>
<div class="two">
<div class="card"><h2 class="h3 card-title">🌟 {{ t.wkWell }}</h2>
<sc-if value="{{ week.hasWell }}"><ul class="lines"><sc-for list="{{ week.well }}" as="x"><li><span>{{ x.text }}</span><span>{{ x.note }}</span></li></sc-for></ul></sc-if>
<sc-if value="{{ week.noWell }}"><p class="empty">{{ t.wkWellNone }}</p></sc-if></div>
<div class="card"><h2 class="h3 card-title">🎯 {{ t.wkPractise }}</h2>
<sc-if value="{{ week.hasWeak }}"><ul class="lines"><sc-for list="{{ week.weak }}" as="x"><li><span>{{ x.text }}</span><span dir="auto">{{ x.note }}</span></li></sc-for></ul></sc-if>
<sc-if value="{{ week.noWeak }}"><p class="empty">{{ t.wkPractiseNone }}</p></sc-if></div>
</div>
<div class="guide">
<svg class="saqr" viewBox="0 0 120 120" aria-hidden="true"><use href="#saqr"/></svg>
<div class="bubble"><p><b>{{ t.wkNext }}:</b> {{ week.next }}</p></div>
</div>
</section>
</sc-if>

<!-- EDITOR: parents and teachers add their own lessons -->
<sc-if value="{{ isEditor }}">
<section class="page editor">
<header class="page-head">
<h1 class="h1">✏️ {{ t.edTitle }}</h1>
<p class="lead">{{ ed.intro }}</p>
</header>
<sc-if value="{{ ed.hasMsg }}"><p class="ed-msg" role="alert">{{ ed.msg }}</p></sc-if>

<sc-if value="{{ ed.notEditing }}">
<div class="card">
<h2 class="h3 card-title">{{ t.edMine }}</h2>
<sc-if value="{{ ed.noList }}"><p class="empty">{{ t.edNone }}</p></sc-if>
<ul class="lines ed-list"><sc-for list="{{ ed.list }}" as="el"><li>
<span><b>{{ el.title }}</b> <span class="small muted">{{ el.meta }}</span></span>
<span class="actions">
<sc-if value="{{ el.notAsking }}"><button type="button" class="btn ghost" onclick="{{ el.tryIt }}">{{ t.edTry }}</button><button type="button" class="btn ghost" onclick="{{ el.edit }}">{{ t.edEdit }}</button><button type="button" class="btn ghost" onclick="{{ el.ask }}">{{ t.edDelete }}</button></sc-if>
<sc-if value="{{ el.asking }}"><span class="confirm">{{ t.edSure }}</span><button type="button" class="btn danger" onclick="{{ el.del }}">{{ t.edYes }}</button><button type="button" class="btn ghost" onclick="{{ el.cancel }}">{{ t.cancel }}</button></sc-if>
</span>
</li></sc-for></ul>
<div class="actions"><button type="button" class="btn primary" onclick="{{ ed.start }}">+ {{ t.edNew }}</button></div>
</div>
<div class="actions">
<button type="button" class="btn secondary" onclick="{{ ed.exportIt }}">{{ t.edExport }}</button>
<label class="btn secondary"><input type="file" accept="application/json,.json" class="file" onchange="{{ ed.importIt }}">{{ t.edImport }}</label>
</div>
</sc-if>

<sc-if value="{{ ed.editing }}">
<div class="card ed-form">
<div class="ed-pair"><b class="ed-label">{{ t.edCourse }}</b><div class="chip-row"><sc-for list="{{ ed.courses }}" as="c"><button type="button" class="{{ c.cls }}" onclick="{{ c.set }}" aria-pressed="{{ c.pressed }}">{{ c.label }}</button></sc-for></div></div>
<div class="ed-pair"><b class="ed-label">{{ t.edLevel }}</b><div class="chip-row"><sc-for list="{{ ed.levels }}" as="c"><button type="button" class="{{ c.cls }}" onclick="{{ c.set }}" aria-pressed="{{ c.pressed }}">{{ c.label }}</button></sc-for></div></div>
<div class="ed-pair"><b class="ed-label">{{ t.edTitleF }}</b><div class="ed-two"><label class="ed-field"><span>{{ t.edEn }}</span><input id="ed-title-en" class="input" type="text" dir="ltr" data-path="title.en" value="{{ ed.d.title.en }}" oninput="{{ ed.input }}"></label><label class="ed-field"><span>{{ t.edAr }}</span><input id="ed-title-ar" class="input" type="text" dir="rtl" data-path="title.ar" value="{{ ed.d.title.ar }}" oninput="{{ ed.input }}"></label></div></div><div class="ed-pair"><b class="ed-label">{{ t.edTeach }}</b><div class="ed-two"><label class="ed-field"><span>{{ t.edEn }}</span><textarea id="ed-teach-en" class="input" rows="3" dir="ltr" data-path="teach.en" oninput="{{ ed.input }}">{{ ed.d.teach.en }}</textarea></label><label class="ed-field"><span>{{ t.edAr }}</span><textarea id="ed-teach-ar" class="input" rows="3" dir="rtl" data-path="teach.ar" oninput="{{ ed.input }}">{{ ed.d.teach.ar }}</textarea></label></div></div><div class="ed-pair"><b class="ed-label">{{ t.edHint }}</b><div class="ed-two"><label class="ed-field"><span>{{ t.edEn }}</span><input id="ed-hint-en" class="input" type="text" dir="ltr" data-path="hint.en" value="{{ ed.d.hint.en }}" oninput="{{ ed.input }}"></label><label class="ed-field"><span>{{ t.edAr }}</span><input id="ed-hint-ar" class="input" type="text" dir="rtl" data-path="hint.ar" value="{{ ed.d.hint.ar }}" oninput="{{ ed.input }}"></label></div></div>
<sc-for list="{{ ed.qs }}" as="eq">
<fieldset class="ed-q"><legend class="h3">{{ eq.n }}</legend>
<div class="ed-pair"><b class="ed-label">{{ t.edQText }}</b><div class="ed-two"><label class="ed-field"><span>{{ t.edEn }}</span><input id="ed-q{{ eq.i }}-q-en" class="input" type="text" dir="ltr" data-path="questions.{{ eq.i }}.q.en" value="{{ eq.q.en }}" oninput="{{ ed.input }}"></label><label class="ed-field"><span>{{ t.edAr }}</span><input id="ed-q{{ eq.i }}-q-ar" class="input" type="text" dir="rtl" data-path="questions.{{ eq.i }}.q.ar" value="{{ eq.q.ar }}" oninput="{{ ed.input }}"></label></div></div>
<label class="ed-field"><span>{{ t.edShow }}</span><input id="ed-q{{ eq.i }}-show" class="input" type="text" dir="auto" data-path="questions.{{ eq.i }}.show" value="{{ eq.q.show }}" oninput="{{ ed.input }}"></label>

<div class="segs" aria-hidden="true"><sc-for list="{{ story.dots }}" as="g"><span class="{{ g.cls }}"></span></sc-for></div>
<sc-if value="{{ speakOk }}"><button type="button" class="{{ story.autoCls }}" onclick="{{ story.toggleAuto }}" aria-pressed="{{ story.auto }}" aria-label="{{ story.autoLabel }}" title="{{ story.autoLabel }}">
<sc-if value="{{ story.auto }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></sc-if>
<sc-if value="{{ story.autoOff }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></sc-if>
</button></sc-if>
<button type="button" class="{{ sound.cls }} sfx-btn" onclick="{{ sound.toggle }}" aria-pressed="{{ sound.on }}" aria-label="{{ sound.label }}" title="{{ sound.label }}"><sc-if value="{{ sound.on }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></sc-if><sc-if value="{{ sound.off }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path d="M3 3l18 18"/></svg></sc-if></button>
<span class="count">{{ story.of }}</span>
</div>
<div class="player-body story-body">
<p class="eyebrow"><span class="dot" style="background: {{ story.color }}"></span>{{ story.title }}</p>
<div class="scene-frame"><svg class="scene" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="240" fill="{{ story.art.sky }}"/><sc-for list="{{ story.art.props }}" as="pp"><use href="{{ pp.href }}" x="{{ pp.x }}" y="{{ pp.y }}" width="{{ pp.w }}" height="{{ pp.h }}" transform="{{ pp.tf }}"/></sc-for></svg></div>
<div class="story-text">
<p><sc-for list="{{ story.textParts }}" as="w"><sc-if value="{{ w.word }}"><button type="button" class="gl-word" onclick="{{ w.tap }}">{{ w.t }}</button></sc-if><sc-if value="{{ w.plain }}">{{ w.t }}</sc-if></sc-for></p>
<sc-if value="{{ speakOk }}"><button type="button" class="speak" onclick="{{ story.say }}" aria-label="{{ t.listenBtn }}" title="{{ t.listenBtn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button></sc-if>
</div>
<div class="actions story-nav">
<sc-if value="{{ story.hasPrev }}"><button type="button" class="btn ghost lg" onclick="{{ story.prev }}"><svg class="flip" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>{{ t.prevPage }}</button></sc-if>
<sc-if value="{{ story.notLast }}"><button type="button" class="btn primary lg point" onclick="{{ story.next }}">{{ t.nextPage }}<svg class="flip" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></sc-if>
<sc-if value="{{ story.isLast }}"><button type="button" class="btn primary lg" onclick="{{ story.quiz }}">{{ t.storyQuiz }}<svg class="flip" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></sc-if>
</div>
</div>
</section>
</sc-if>

<!-- COURSE: its lessons as a path -->
<sc-if value="{{ isCourse }}">
<section class="page narrow">
<button type="button" class="back" onclick="{{ goHome }}"><svg class="flip" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>{{ t.back }}</button>
<header class="course-hero" style="--c: {{ course.color }}; --t: {{ course.tint }}">
<span class="tile lg" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="{{ course.icon }}"/></svg></span>
<div class="course-hero-text">
<h1 class="h1">{{ course.name }}</h1>
<p class="meta">{{ course.age }} · {{ course.doneText }} · {{ course.starsText }} · <b>{{ course.masteryText }}</b></p>
<sc-if value="{{ course.allDone }}"><button type="button" class="btn secondary cert-btn" onclick="{{ course.courseCert }}">🎓 {{ t.certBtn }}</button></sc-if>
<div class="bar" role="progressbar" aria-label="{{ course.name }}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ course.pctNum }}"><div style="width: {{ course.pct }}"></div></div>
</div>
</header>
<sc-for list="{{ course.levels }}" as="g">
<div class="{{ g.cls }}"><h2 class="h3">{{ g.name }}</h2><span class="level-right"><span class="small muted">{{ g.mastery }}</span><sc-if value="{{ g.done }}"><button type="button" class="btn ghost cert-btn" onclick="{{ g.cert }}">🎓 {{ t.certBtn }}</button></sc-if></span></div>
<ol class="path" style="--c: {{ course.color }}; --t: {{ course.tint }}">
<sc-for list="{{ g.rows }}" as="l">
<li class="{{ l.state }}">
<span class="marker" aria-hidden="true"><span class="num">{{ l.num }}</span><svg class="tick" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></span>
<div class="step-card">
<div class="step-main">
<sc-if value="{{ l.isNext }}"><span class="tag next-tag">{{ t.upNext }}</span></sc-if>
<b>{{ l.title }}</b>
<span class="small muted">{{ l.note }}</span>
<span class="{{ l.mCls }}">{{ l.mLabel }}</span>
</div>
<span class="stars" role="img" aria-label="{{ l.starsText }}"><sc-for list="{{ l.stars }}" as="s"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="{{ s.fill }}"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg></sc-for></span>
<button type="button" class="icon-btn ws-btn" onclick="{{ l.sheet }}" aria-label="{{ t.wsBtn }}: {{ l.title }}" title="{{ t.wsBtn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7zM14 3v4h4M9.5 12h6M9.5 15.5h6M9.5 9h2"/></svg></button>
<button type="button" class="{{ l.btnCls }}" onclick="{{ l.start }}">{{ l.btn }}</button>
</div>
</li>
</sc-for>
</ol>
</sc-for>
<div class="card challenge" style="--c: {{ course.color }}; --t: {{ course.tint }}">
<span class="challenge-ic" aria-hidden="true">🏆</span>
<div class="challenge-text">
<h2 class="h3">{{ t.chTitle }}</h2>
<p class="small muted">{{ t.chText }}</p>
<sc-if value="{{ course.ch.hasBest }}"><span class="small"><b>{{ course.ch.best }}</b></span></sc-if>
<sc-if value="{{ course.ch.locked }}"><span class="small muted">🔒 {{ t.chLocked }}</span></sc-if>
</div>
<sc-if value="{{ course.ch.open }}"><button type="button" class="btn primary" onclick="{{ course.ch.start }}">{{ t.chStart }}</button></sc-if>
</div>
</section>
</sc-if>

<!-- LESSON: learn, then questions, then the result -->
<sc-if value="{{ isLesson }}">
<section class="player" style="--c: {{ course.color }}; --t: {{ course.tint }}">
<div class="player-top">
<button type="button" class="icon-btn" onclick="{{ ls.backCourse }}" aria-label="{{ ls.backLabel }}" title="{{ ls.backLabel }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div class="segs" aria-hidden="true"><sc-for list="{{ ls.segs }}" as="g"><span class="{{ g.cls }}"></span></sc-for></div>
<sc-if value="{{ speakOk }}"><button type="button" class="{{ ls.autoCls }}" onclick="{{ ls.toggleAuto }}" aria-pressed="{{ ls.auto }}" aria-label="{{ ls.autoLabel }}" title="{{ ls.autoLabel }}">
<sc-if value="{{ ls.auto }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></sc-if>
<sc-if value="{{ ls.autoOff }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></sc-if>
</button></sc-if>
<button type="button" class="{{ sound.cls }} sfx-btn" onclick="{{ sound.toggle }}" aria-pressed="{{ sound.on }}" aria-label="{{ sound.label }}" title="{{ sound.label }}"><sc-if value="{{ sound.on }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></sc-if><sc-if value="{{ sound.off }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path d="M3 3l18 18"/></svg></sc-if></button>
<span class="count">{{ ls.count }}</span>
</div>

<div class="player-body">
<sc-if value="{{ ls.isTeach }}">
<div class="pcard">
<p class="eyebrow"><span class="dot" style="background: {{ course.color }}"></span>{{ course.name }} · {{ ls.of }}</p>
<h1 class="h1">{{ ls.title }}</h1>
<div class="guide small-guide">
<svg class="saqr" viewBox="0 0 120 120" role="img" aria-label="{{ t.guide }}"><use href="#saqr"/></svg>
<div class="bubble"><p>{{ ls.teachIntro }}</p></div>
</div>
<sc-if value="{{ ls.diffNote }}"><p class="{{ ls.diffCls }}">{{ ls.diffNote }}</p></sc-if>
<div class="teach-box">
<div class="teach-top"><span class="teach-label">{{ t.learn }}</span><sc-if value="{{ speakOk }}"><button type="button" class="speak" onclick="{{ ls.sayTeach }}" aria-label="{{ t.listenBtn }}" title="{{ t.listenBtn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button></sc-if></div>
<p class="teach"><sc-for list="{{ ls.teachParts }}" as="w"><sc-if value="{{ w.word }}"><button type="button" class="gl-word" onclick="{{ w.tap }}">{{ w.t }}</button></sc-if><sc-if value="{{ w.plain }}">{{ w.t }}</sc-if></sc-for></p>
</div>
<sc-if value="{{ ls.lessonVideo }}"><div class="lesson-video"><b>🎬 {{ t.lessonVideo }}</b><video controls preload="metadata" playsinline src="{{ ls.lessonVideo }}"></video></div></sc-if>
<!-- Lesson podcast: shown only when a file audio/<lesson id>-<en or ar>.m4a (or .mp3, .wav) exists -->
<div class="listen" hidden>
<span>{{ t.listen }}</span>
<audio controls preload="metadata" onloadedmetadata="{{ ls.audioReady }}">
<source src="{{ ls.audio }}.m4a" type="audio/mp4">
<source src="{{ ls.audio }}.mp3" type="audio/mpeg">
<source src="{{ ls.audio }}.wav" type="audio/wav">
</audio>
</div>
<div class="actions"><button type="button" class="btn primary lg point" onclick="{{ ls.startQuiz }}">{{ t.startQuiz }}<svg class="flip" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
</div>
</sc-if>

<sc-if value="{{ ls.isQuiz }}">
<div class="pcard quiz">
<div class="prompt-row"><h1 class="prompt">{{ ls.prompt }}</h1><sc-if value="{{ speakOk }}"><button type="button" class="speak" onclick="{{ ls.sayQuestion }}" aria-label="{{ t.listenBtn }}" title="{{ t.listenBtn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button></sc-if></div>
<sc-if value="{{ ls.hasSay }}">
<button type="button" class="say-btn" onclick="{{ ls.sayWord }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span>{{ t.listenBtn }}</span></button>
</sc-if>
<sc-if value="{{ ls.isBlend }}">
<div class="show-box blend-box">
<sc-if value="{{ ls.blendApart }}"><div class="blend-tiles" dir="{{ ls.blendDir }}"><sc-for list="{{ ls.blendTiles }}" as="bt"><button type="button" class="blend-tile" style="{{ bt.style }}" onclick="{{ bt.tap }}">{{ bt.ch }}</button></sc-for></div></sc-if>
<sc-if value="{{ ls.blendJoined }}"><div class="show blend-word" dir="auto">{{ ls.blendWord }}</div></sc-if>
<button type="button" class="btn secondary blend-btn" onclick="{{ ls.blendToggle }}"><sc-if value="{{ ls.blendApart }}">🔗 {{ t.blendBtn }}</sc-if><sc-if value="{{ ls.blendJoined }}">↔️ {{ t.blendSplit }}</sc-if></button>
</div>
</sc-if>
<sc-if value="{{ ls.notBlendShow }}">
<div class="show-box"><sc-if value="{{ ls.hasImg }}"><img class="q-img" src="{{ ls.img }}" alt=""></sc-if><span class="show" dir="{{ ls.showDir }}">{{ ls.show }}</span><span class="gloss">{{ ls.gloss }}</span>
<sc-if value="{{ ls.hasSound }}"><button type="button" class="btn secondary sound-btn" onclick="{{ ls.playSound }}">🔊 {{ t.hearIt }}</button></sc-if></div>
</sc-if>
<sc-if value="{{ ls.hasSeq }}">
<div class="seq" dir="ltr">
<sc-for list="{{ ls.seq }}" as="sq"><span role="img" aria-label="{{ sq.name }}" style="background: {{ sq.hex }}"></span></sc-for>
<span class="q" aria-hidden="true">?</span>
</div>
</sc-if>
<sc-if value="{{ ls.isChoice }}">
<div class="{{ ls.optsCls }}">
<sc-for list="{{ ls.opts }}" as="o">
<button type="button" class="{{ o.cls }}" onclick="{{ o.tap }}" aria-disabled="{{ o.dis }}">
<span class="key" aria-hidden="true">{{ o.key }}</span>
<sc-if value="{{ o.hasSw }}"><i style="background: {{ o.sw }}"></i></sc-if>
<span class="opt-label" dir="auto">{{ o.label }}</span>
</button>
</sc-for>
</div>
</sc-if>

<!-- COUNT: drag dates into the basket -->
<sc-if value="{{ ls.isCount }}">
<div class="count-act">
<div class="tray" aria-label="{{ t.tray }}">
<sc-for list="{{ ls.cnt.tray }}" as="d"><button type="button" class="date" onpointerdown="{{ d.down }}" onclick="{{ d.key }}" aria-label="{{ t.dateLabel }}"><svg viewBox="0 0 40 52" aria-hidden="true"><use href="#p-date"/></svg></button></sc-for>
</div>
<div class="basket" aria-label="{{ t.basket }}">
<sc-for list="{{ ls.cnt.basket }}" as="d"><button type="button" class="date in" onclick="{{ d.out }}" aria-label="{{ t.takeBack }}"><svg viewBox="0 0 40 52" aria-hidden="true"><use href="#p-date"/></svg></button></sc-for>
<sc-if value="{{ ls.cnt.empty }}"><span class="basket-hint">{{ t.basket }}</span></sc-if>
</div>
<sc-if value="{{ ls.cnt.notSolved }}"><div class="actions center"><button type="button" class="btn primary lg point" onclick="{{ ls.cnt.check }}">{{ t.check }}</button></div></sc-if>
</div>
</sc-if>

<!-- TRACE: draw over the letter or shape -->
<sc-if value="{{ ls.isTrace }}">
<div class="trace-act">
<canvas class="trace" width="300" height="300" onpointerdown="{{ ls.trc.down }}" role="img" aria-label="{{ ls.prompt }}"></canvas>
<sc-if value="{{ ls.trc.notSolved }}"><div class="actions center"><button type="button" class="btn ghost lg" onclick="{{ ls.trc.watch }}">👀 {{ t.watchAgain }}</button><button type="button" class="btn ghost lg" onclick="{{ ls.trc.clear }}">{{ t.clear }}</button><button type="button" class="btn primary lg point" onclick="{{ ls.trc.check }}">{{ t.check }}</button></div></sc-if>
</div>
</sc-if>

<!-- CODE: build a program of arrow blocks, then run it -->
<sc-if value="{{ ls.isCode }}">
<div class="code-act">
<div class="grid-board" dir="ltr" style="--cols: {{ ls.cd.cols }}">
<sc-for list="{{ ls.cd.rows }}" as="row"><sc-for list="{{ row.cells }}" as="cell"><div class="{{ cell.cls }}">
<sc-if value="{{ cell.saqr }}"><svg class="saqr-mini" viewBox="0 0 120 120" aria-hidden="true"><use href="#saqr"/></svg></sc-if>
<sc-if value="{{ cell.hasItem }}"><span aria-hidden="true">{{ cell.item }}</span></sc-if>
</div></sc-for></sc-for>
</div>
<sc-if value="{{ ls.isPy }}">
<div class="prog-box">
<div class="prog-head"><b>{{ t.pyCode }}</b><sc-if value="{{ ls.cd.pyHasMax }}"><span class="small muted">{{ ls.cd.pyLines }}</span></sc-if></div>
<div class="py-wrap" dir="ltr"><pre class="py-hl" id="py-hl" aria-hidden="true"></pre>
<textarea id="py-code" class="py-editor" dir="ltr" rows="6" spellcheck="false" autocapitalize="off" autocomplete="off" oninput="{{ ls.cd.pyInput }}" onscroll="{{ ls.cd.pyScroll }}" aria-label="{{ t.pyCode }}">{{ ls.cd.pyText }}</textarea></div>
<span class="small muted py-help" dir="ltr">{{ t.pyHelp }}</span>
</div>
</sc-if>
<sc-if value="{{ ls.isBlocks }}">
<div class="prog-box">
<div class="prog-head"><b>{{ t.cdProgram }}</b><sc-if value="{{ ls.cd.hasMax }}"><span class="small muted">{{ ls.cd.count }}</span></sc-if></div>
<div class="prog" dir="ltr">
<sc-for list="{{ ls.cd.prog }}" as="b"><button type="button" class="{{ b.cls }}" onclick="{{ b.tap }}" aria-label="{{ b.aria }}">{{ b.label }}</button></sc-for>
<sc-if value="{{ ls.cd.empty }}"><span class="small muted prog-empty">{{ t.cdEmpty }}</span></sc-if>
</div>
</div>
</sc-if>
<sc-if value="{{ ls.cd.notSolved }}">
<sc-if value="{{ ls.isBlocks }}"><div class="palette" dir="ltr"><sc-for list="{{ ls.cd.palette }}" as="b"><button type="button" class="{{ b.cls }}" onclick="{{ b.tap }}" aria-label="{{ b.aria }}" aria-disabled="{{ b.dis }}">{{ b.label }}</button></sc-for></div></sc-if>
<div class="actions center"><button type="button" class="btn ghost lg" onclick="{{ ls.cd.clear }}">{{ t.cdClear }}</button><button type="button" class="btn primary lg point" onclick="{{ ls.cd.run }}">▶ {{ t.cdRun }}</button></div>
</sc-if>
</div>
</sc-if>

<!-- MATCH: pair each item on one side with its partner -->
<sc-if value="{{ ls.isMatch }}">
<div class="match">
<div class="mcol"><sc-for list="{{ ls.mtc.lefts }}" as="m"><button type="button" class="{{ m.cls }}" onclick="{{ m.tap }}" aria-pressed="{{ m.pressed }}"><span dir="auto">{{ m.label }}</span></button></sc-for></div>
<div class="mcol"><sc-for list="{{ ls.mtc.rights }}" as="m"><button type="button" class="{{ m.cls }}" onclick="{{ m.tap }}" aria-pressed="{{ m.pressed }}"><span dir="auto">{{ m.label }}</span></button></sc-for></div>
</div>
</sc-if>
</div>
<div class="{{ ls.fbCls }}">
<div class="fb-inner">
<div class="fb-guide">
<svg class="{{ ls.guideCls }}" viewBox="0 0 120 120" aria-hidden="true"><use href="#saqr"/></svg>
<div class="fb-text" role="status" aria-live="polite">
<span class="fb-msg">{{ ls.msg }}</span>
<sc-if value="{{ ls.hasStuckWork }}"><span class="fb-hint stuck-work" dir="auto">{{ ls.stuckWork }}</span></sc-if>
<sc-if value="{{ ls.hasHint }}"><span class="fb-hint"><b>{{ t.hintWord }}</b> <span dir="auto">{{ ls.hint }}</span></span></sc-if>
</div>
<sc-if value="{{ ls.hasHint }}"><sc-if value="{{ speakOk }}"><button type="button" class="speak" onclick="{{ ls.sayHint }}" aria-label="{{ t.listenBtn }}" title="{{ t.listenBtn }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button></sc-if></sc-if>
</div>
<sc-if value="{{ ls.solved }}"><button type="button" class="btn primary lg point up" onclick="{{ ls.next }}">{{ ls.nextLabel }}</button></sc-if>
<sc-if value="{{ ls.stuckShow }}"><button type="button" class="btn ghost stuck-btn" onclick="{{ ls.stuckPress }}">{{ ls.stuckLabel }}</button></sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{ ls.isDone }}">
<div class="pcard result">
<div class="champ-row">
<sc-if value="{{ hasPhoto }}"><div class="champ"><img src="{{ photo }}" alt="{{ childName }}"></div></sc-if>
<div class="guide cheer-guide"><svg class="saqr cheer" viewBox="0 0 120 120" role="img" aria-label="{{ t.guide }}"><use href="#saqr"/></svg><div class="bubble"><p>{{ ls.doneSay }}</p></div></div>
</div>
<span class="stars big-stars" aria-hidden="true"><sc-for list="{{ ls.earnedStars }}" as="s"><svg width="64" height="64" viewBox="0 0 24 24" fill="{{ s.fill }}"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg></sc-for></span>
<sc-if value="{{ ls.hasCert }}"><div class="cert-offer" role="status"><b>🎓 {{ ls.certMsg }}</b><button type="button" class="btn accent point" onclick="{{ ls.openCert }}">{{ t.certGet }}</button></div></sc-if>
<sc-if value="{{ ls.hasChanges }}"><div class="changes" role="status"><b>{{ t.chChanges }}</b><sc-for list="{{ ls.changes }}" as="ch"><span class="{{ ch.cls }}">{{ ch.text }}</span></sc-for></div></sc-if>
<sc-if value="{{ ls.noChanges }}"><p class="small muted">{{ t.chSame }}</p></sc-if>
<sc-if value="{{ ls.hasLevel }}"><div class="{{ ls.levelCls }} level-msg" role="status">{{ ls.levelMsg }}</div></sc-if>
<sc-if value="{{ ls.goalHit }}"><div class="goal-hit" role="status">🎯 {{ t.goalHit }}</div></sc-if>
<sc-if value="{{ ls.hasNewSticker }}"><div class="new-sticker" role="status"><span class="sticker big" aria-hidden="true">{{ ls.newSticker }}</span><b>{{ t.newSticker }}</b></div></sc-if>
<h1 class="h1">{{ ls.doneTitle }}</h1>
<p class="lead" role="status">{{ ls.title }}: {{ ls.earnedText }}</p>
<div class="result-stats">
<div><b dir="ltr">{{ ls.firstTry }}</b><span>{{ t.firstTry }}</span></div>
<div><b dir="ltr">{{ ls.earnedNum }}</b><span>{{ t.starsLabel }}</span></div>
<div><b dir="ltr">{{ ls.time }}</b><span>{{ t.timeTaken }}</span></div>
</div>
<div class="actions center">
<sc-if value="{{ todayRun }}"><button type="button" class="btn primary lg point" onclick="{{ todayNext }}">{{ t.tdNextIn }}</button><button type="button" class="btn ghost" onclick="{{ goToday }}">{{ t.tdBack }}</button></sc-if>
<sc-if value="{{ ls.fromJourney }}"><button type="button" class="btn primary lg point" onclick="{{ ls.backCourse }}">{{ t.jBack }}</button></sc-if>
<sc-if value="{{ ls.hasNext }}"><button type="button" class="btn primary lg" onclick="{{ ls.nextLesson }}">{{ t.nextLesson }}</button></sc-if>
<sc-if value="{{ ls.isLast }}"><button type="button" class="btn primary lg" onclick="{{ goHome }}">{{ t.backHome }}</button></sc-if>
<button type="button" class="btn secondary lg" onclick="{{ ls.again }}">{{ t.tryAgain }}</button>
<sc-if value="{{ ls.notJourney }}"><button type="button" class="btn ghost lg" onclick="{{ ls.backCourse }}">{{ ls.backLabel }}</button></sc-if>
</div>
</div>
</sc-if>
</div>
</section>
</sc-if>

<!-- FAMILY REPORT -->
<sc-if value="{{ isReport }}">
<section class="page">
<header class="page-head">
<p class="eyebrow">{{ r.date }}</p>
<h1 class="h1">{{ t.rTitle }}</h1>
<p class="lead no-print">{{ t.rIntro }}</p>
</header>

<div class="card profile">
<div class="photo-field">
<span class="avatar xl" aria-hidden="true"><sc-if value="{{ hasPhoto }}"><img src="{{ photo }}" alt=""></sc-if><sc-if value="{{ noPhoto }}">{{ initial }}</sc-if></span>
<div class="photo-actions">
<b>{{ t.photoLabel }}</b>
<div class="actions no-print">
<label class="btn secondary"><input type="file" accept="image/*" class="file" onchange="{{ setPhoto }}">{{ photoBtn }}</label>
<sc-if value="{{ hasPhoto }}"><button type="button" class="btn ghost" onclick="{{ removePhoto }}">{{ t.photoRemove }}</button></sc-if>
</div>
<span class="small muted no-print">{{ t.photoNote }}</span>
</div>
</div>
<div class="field">
<span class="field-label">{{ t.ageLabel }}</span>
<div class="age-row"><sc-for list="{{ ageInfo.choices }}" as="a"><button type="button" class="{{ a.cls }}" onclick="{{ a.set }}" aria-pressed="{{ a.pressed }}">{{ a.label }}</button></sc-for></div>
</div>
<div class="field">
<label for="child-name">{{ t.rName }}</label>
<input id="child-name" class="input" type="text" maxlength="40" autocomplete="off" placeholder="{{ t.rNamePh }}" value="{{ r.name }}" oninput="{{ r.setName }}">
</div>
<sc-if value="{{ r.strong }}"><p class="strong-note">{{ r.strong }}</p></sc-if>
</div>

<div class="stats">
<div class="stat"><span class="stat-ic" style="background: #DDF3E6; color: #0B6B3A"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></span><div><b dir="ltr">{{ total.done }}<small> / {{ total.lessons }}</small></b><span>{{ t.rLessons }}</span></div></div>
<div class="stat"><span class="stat-ic" style="background: #FFF1C7; color: #8A5A00"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg></span><div><b dir="ltr">{{ total.stars }}<small> / {{ total.starsMax }}</small></b><span>{{ t.rStars }}</span></div></div>
<div class="stat"><span class="stat-ic" style="background: #DCEEFD; color: #145E96"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div><b>{{ r.minutes }}</b><span>{{ t.rMinutes }}</span></div></div>
<div class="stat"><span class="stat-ic" style="background: #FFE1EC; color: #A3245A"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><div><b class="sm">{{ r.last }}</b><span>{{ t.rLast }}</span></div></div>
</div>


<div class="card plan">
<div class="plan-head">
<div class="page-head" style="gap: 4px">
<h2 class="h2">{{ t.planTitle }}</h2>
<p class="muted">{{ t.planIntro }}</p>
</div>
</div>
<p style="font-weight: 800">{{ plan.summary }}</p>
<sc-if value="{{ plan.any }}">
<h3 class="h3">{{ t.planLevels }}</h3>
<div class="levels">
<sc-for list="{{ plan.levels }}" as="lv"><div class="level" style="--c: {{ lv.color }}"><div class="level-top"><b>{{ lv.name }}</b><span class="level-score" dir="ltr">{{ lv.score }}</span></div><span class="{{ lv.badge }}">{{ lv.label }}</span></div></sc-for>
</div>
</sc-if>
<sc-if value="{{ plan.hasSteps }}">
<h3 class="h3">{{ t.planNext }}</h3>
<ol class="plan-steps">
<sc-for list="{{ plan.steps }}" as="st">
<li class="pstep" style="--c: {{ st.color }}">
<span class="pstep-num" aria-hidden="true">{{ st.num }}</span>
<div class="pstep-main">
<b>{{ st.title }}</b>
<span class="why">{{ st.why }}</span>
<sc-if value="{{ st.hasMissed }}"><div class="focus-items"><span class="small muted" style="background: none; padding: 0">{{ t.stMissed }}</span><sc-for list="{{ st.missed }}" as="m"><span dir="auto">{{ m }}</span></sc-for></div></sc-if>
</div>
<button type="button" class="btn secondary" onclick="{{ st.go }}">{{ t.planGo }}</button>
</li>
</sc-for>
</ol>
</sc-if>
<sc-for list="{{ plan.tips }}" as="tp">
<div class="home-tip"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 9.5V21h14V9.5"/></svg><div><b>{{ tp.title }}</b><span>{{ tp.text }}</span></div></div>
</sc-for>
</div>

<div class="card">
<h2 class="h3 card-title">{{ t.rBySubject }}</h2>
<p class="small muted mastery-key">{{ t.masteryKey }}</p>
<sc-for list="{{ courses }}" as="c">
<details class="subject" style="--c: {{ c.color }}">
<summary>
<span class="tile sm" aria-hidden="true" style="background: {{ c.color }}"><svg viewBox="0 0 24 24"><path d="{{ c.icon }}"/></svg></span>
<span class="subject-name">{{ c.name }}</span>
<span class="subject-bar"><span class="bar" role="progressbar" aria-label="{{ c.name }}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ c.pctNum }}"><span style="width: {{ c.pct }}"></span></span></span>
<span class="small muted subject-meta">{{ c.doneText }} · {{ c.masteryText }}</span>
<svg class="chev" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
</summary>
<ul class="lines">
<sc-for list="{{ c.lessons }}" as="l"><li><span>{{ l.num }}. {{ l.title }} <span class="{{ l.mCls }}">{{ l.mLabel }}</span></span><span>{{ l.reportNote }}</span></li></sc-for>
</ul>
</details>
</sc-for>
</div>

<div class="two">
<div class="card">
<h2 class="h3 card-title">{{ t.rPractice }}</h2>
<sc-if value="{{ r.hasPractice }}"><ul class="lines"><sc-for list="{{ r.practice }}" as="p"><li><span>{{ p.text }}</span><span>{{ p.note }}</span></li></sc-for></ul></sc-if>
<sc-if value="{{ r.noPractice }}"><p class="empty">{{ t.rNoPractice }}</p></sc-if>
</div>
<div class="card">
<h2 class="h3 card-title">{{ t.rRecent }}</h2>
<sc-if value="{{ r.hasRecent }}"><ul class="lines"><sc-for list="{{ r.recent }}" as="p"><li><span>{{ p.text }}</span><span>{{ p.note }}</span></li></sc-for></ul></sc-if>
<sc-if value="{{ r.noRecent }}"><p class="empty">{{ t.rNoRecent }}</p></sc-if>
</div>
</div>

<article class="card review-days">
<h2 class="h3">📅 {{ t.rvBoxTitle }}</h2>
<p class="small muted">{{ t.rvBoxText }}</p>
<sc-if value="{{ reviewDays.any }}"><div class="rv-days"><sc-for list="{{ reviewDays.list }}" as="d"><div class="{{ d.cls }}"><b>{{ d.day }}</b><span class="small">{{ d.n }}</span></div></sc-for></div></sc-if>
<sc-if value="{{ reviewDays.none }}"><p class="small">{{ t.rvNone }}</p></sc-if>
</article>

<article class="card no-print time-limit">
<h2 class="h3">⏰ {{ t.tlTitle }}</h2>
<p class="small muted">{{ t.tlText }}</p>
<div class="chip-row"><sc-for list="{{ limit.choices }}" as="c"><button type="button" class="{{ c.cls }}" onclick="{{ c.set }}" aria-pressed="{{ c.pressed }}">{{ c.label }}</button></sc-for></div>
<span class="small">{{ limit.used }}</span>
</article>

<div class="actions no-print">
<button type="button" class="btn secondary" onclick="{{ r.print }}">{{ t.print }}</button>
<button type="button" class="btn secondary" onclick="{{ goWeek }}">📅 {{ t.wkBtn }}</button>
<button type="button" class="btn secondary" onclick="{{ goEditor }}">✏️ {{ t.edBtn }}</button>
<button type="button" class="btn secondary" onclick="{{ goVideo }}">🎬 {{ t.vdBtn }}</button>
<button type="button" class="btn secondary" onclick="{{ goNext }}">🧭 {{ t.nxBtn }}</button>
<sc-if value="{{ r_remove.can }}"><button type="button" class="btn ghost" onclick="{{ r_remove.ask }}">{{ t.removeChild }}</button></sc-if>
<sc-if value="{{ r_remove.asking }}"><span role="alert" class="confirm">{{ t.removeSure }}</span><button type="button" class="btn danger" onclick="{{ r_remove.yes }}">{{ t.yesRemove }}</button><button type="button" class="btn ghost" onclick="{{ r_remove.cancel }}">{{ t.cancel }}</button></sc-if>
<sc-if value="{{ r.notConfirming }}"><button type="button" class="btn ghost" onclick="{{ r.askReset }}">{{ t.reset }}</button></sc-if>
<sc-if value="{{ r.confirming }}">
<span role="alert" class="confirm">{{ t.sure }}</span>
<button type="button" class="btn danger" onclick="{{ r.doReset }}">{{ t.yesReset }}</button>
<button type="button" class="btn ghost" onclick="{{ r.cancelReset }}">{{ t.cancel }}</button>
</sc-if>
</div>
</section>
</sc-if>

</main>
</div>
</template>

<script src="js/runtime.js"></script>
<script src="js/courses.js"></script>
<script src="js/stories.js"></script>
<script src="js/discover.js"></script>
<script src="js/glossary.js"></script>
<script src="js/learn.js"></script>
</body>
</html>
