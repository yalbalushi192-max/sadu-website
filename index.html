</div>
</article>
</div>

<!-- FALCON FLIGHT (playable) -->
<div id="falcon-flight" style="background: #FFFFFF; border-radius: 40px; padding: clamp(22px, 4vw, 36px); box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; scroll-margin-top: 24px; box-shadow: 0 30px 44px -16px rgba(35,32,74,.3), inset 0 -12px 18px rgba(35,32,74,.07), inset 0 12px 18px rgba(255,255,255,.9)">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h3 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.2">Falcon Flight</h3>
<span style="padding: 6px 14px; border-radius: 999px; background: #C4E4FC; font-weight: 800; font-size: 14px">Ages 6 to 9</span>
</div>

<sc-if value="{{ ff.idle }}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; color: #4B4870; max-width: 640px">The falcon wants to reach the oasis, 8 dunes away. Solve each sum before the wind changes and it flies one dune further. A wrong answer or a change of wind costs a feather, and you have three.</p>
<button type="button" onclick="{{ ff.start }}" style="align-self: flex-start; border: 0; padding: 14px 26px; min-height: 52px; border-radius: 999px; background: #3FA9F5; color: #23204A; font-weight: 800; font-size: 17px; box-shadow: 0 12px 16px -8px rgba(35,32,74,.35), inset 0 -6px 8px rgba(35,32,74,.16), inset 0 6px 8px rgba(255,255,255,.5)">Take off</button>
</sc-if>

<sc-if value="{{ ff.scene }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<div style="padding: 10px 16px; min-width: 64px; border-radius: 20px; background: #FFC93C; text-align: center; box-shadow: inset 0 -5px 8px rgba(35,32,74,.14), inset 0 5px 8px rgba(255,255,255,.55)">
<div dir="ltr" style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">{{ ff.step }}</div>
<div style="font-weight: 800; font-size: 12px">dunes</div>
</div>
<div role="img" aria-label="{{ ff.feathersLabel }}" style="padding: 10px 16px; border-radius: 20px; background: #FBF3E4; text-align: center; box-shadow: inset 0 5px 8px rgba(35,32,74,.1)">
<div style="display: flex; gap: 6px; justify-content: center; height: 22px; align-items: center">
<sc-for list="{{ ff.feathers }}" as="fe" hint-placeholder-count="3">
<span style="width: 16px; height: 16px; border-radius: 50%; background: {{ fe.bg }}; box-shadow: inset 0 -3px 4px rgba(35,32,74,.18)"></span>
</sc-for>
</div>
<div style="font-weight: 800; font-size: 12px">feathers</div>
</div>
</div>
<div dir="ltr" aria-hidden="true" style="position: relative; height: 190px; border-radius: 28px; background: #C4E4FC; overflow: hidden; box-shadow: inset 0 6px 10px rgba(35,32,74,.14)">
<div style="position: absolute; top: 16px; right: 26px; width: 46px; height: 46px; border-radius: 50%; background: #FFC93C; box-shadow: inset 0 -6px 8px rgba(35,32,74,.12), inset 0 6px 8px rgba(255,255,255,.6)"></div>
<svg width="100%" height="90" viewBox="0 0 400 90" preserveAspectRatio="none" style="position: absolute; left: 0; bottom: 0; display: block"><path d="M0 90V52q50-34 100 0t100 0 100 0 100 0v38z" fill="#F4D9A0"/><path d="M0 90V72q50-22 100 0t100 0 100 0 100 0v18z" fill="#EBC47E"/></svg>
<svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#0B6B3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 12px; bottom: 30px"><path d="M12 21c0-4 .4-7 1-10"/><path d="M13 11c-1-3-4-4-7-3M13 11c1-3 4-4 7-3M13 11c-3-.6-6 .4-7 3.4M13 11c3-.6 6 .4 7 3.4M13 11c0-3-1-5-3-6"/></svg>
<div id="ff-bird" style="position: absolute; top: 40px; left: calc(2% + {{ ff.pos }}%); width: 64px; height: 64px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 16px -8px rgba(35,32,74,.35), inset 0 -6px 8px rgba(35,32,74,.1), inset 0 6px 8px rgba(255,255,255,.9)"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#23204A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.500 13c4-.5 6-5 9.500-5 2.500 0 3.500 2 9.500 1-2 5-6 8-10.500 8-3.500 0-6.500-1.500-8.500-4z"/><path d="M12 8c0-2 1.500-3.500 3.500-4"/></svg></div>
</div>
</sc-if>

<sc-if value="{{ ff.playing }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span style="font-weight: 800; font-size: 14px; color: #4B4870">Wind</span>
<div aria-hidden="true" style="flex: 1 1 200px; height: 18px; border-radius: 999px; background: #EADFC8; box-shadow: inset 0 4px 6px rgba(35,32,74,.16); overflow: hidden">
<div id="ff-wind" style="height: 100%; width: {{ ff.barW }}; border-radius: 999px; background: #3FA9F5; box-shadow: inset 0 -4px 6px rgba(35,32,74,.2), inset 0 4px 6px rgba(255,255,255,.4)"></div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
<span dir="ltr" style="flex: 1 1 220px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(36px, 6vw, 52px); line-height: 1.1">{{ ff.sum }}</span>
<div role="group" aria-label="Answers" style="flex: 1 1 300px; display: flex; gap: 12px">
<sc-for list="{{ ff.choices }}" as="ch" hint-placeholder-count="3">
<button type="button" onclick="{{ ch.tap }}" style="flex: 1 1 0; border: 0; padding: 0; min-width: 0; height: 76px; border-radius: 24px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; color: #23204A; opacity: {{ ch.op }}; background: {{ ch.bg }}; box-shadow: 0 12px 16px -8px rgba(35,32,74,.35), inset 0 -7px 10px rgba(35,32,74,.16), inset 0 7px 10px rgba(255,255,255,.55)">{{ ch.label }}</button>
</sc-for>
</div>
</div>
<span role="status" aria-live="polite" style="font-weight: 800; min-height: 26px; color: {{ ff.msgColor }}">{{ ff.msg }}</span>
</sc-if>

<sc-if value="{{ ff.won }}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.3">You reached the oasis!</span>
<span style="font-size: 19px">{{ ff.wonText }}</span>
</div>
<button type="button" onclick="{{ ff.start }}" style="align-self: flex-start; border: 0; padding: 14px 26px; min-height: 52px; border-radius: 999px; background: #3FA9F5; color: #23204A; font-weight: 800; font-size: 17px; box-shadow: 0 12px 16px -8px rgba(35,32,74,.35), inset 0 -6px 8px rgba(35,32,74,.16), inset 0 6px 8px rgba(255,255,255,.5)">Fly again</button>
</sc-if>

<sc-if value="{{ ff.lost }}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.3">The wind won this time.</span>
<span style="font-size: 19px">{{ ff.lostText }}</span>
</div>
<button type="button" onclick="{{ ff.start }}" style="align-self: flex-start; border: 0; padding: 14px 26px; min-height: 52px; border-radius: 999px; background: #3FA9F5; color: #23204A; font-weight: 800; font-size: 17px; box-shadow: 0 12px 16px -8px rgba(35,32,74,.35), inset 0 -6px 8px rgba(35,32,74,.16), inset 0 6px 8px rgba(255,255,255,.5)">Fly again</button>
</sc-if>
</div>

<!-- LETTER CATCH (playable) -->
<div id="letter-catch" style="background: #FFFFFF; border-radius: 40px; padding: clamp(22px, 4vw, 36px); box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; scroll-margin-top: 24px; box-shadow: 0 30px 44px -16px rgba(35,32,74,.3), inset 0 -12px 18px rgba(35,32,74,.07), inset 0 12px 18px rgba(255,255,255,.9)">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h3 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.2">Letter Catch</h3>
<span style="padding: 6px 14px; border-radius: 999px; background: #FFD0E2; font-weight: 800; font-size: 14px">Ages 2 to 5</span>
</div>
<div role="group" aria-label="Choose the letters" style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" onclick="{{ lc.setEn }}" aria-pressed="{{ lc.enOn }}" lang="en" style="border: 0; padding: 12px 22px; min-height: 46px; border-radius: 999px; font-weight: 800; font-size: 16px; box-shadow: 0 10px 16px -8px rgba(35,32,74,.3), inset 0 -5px 8px rgba(35,32,74,.12), inset 0 5px 8px rgba(255,255,255,.5); font-family: 'Nunito', sans-serif; background: {{ lc.enBg }}; color: {{ lc.enFg }}">English</button>
<button type="button" onclick="{{ lc.setAr }}" aria-pressed="{{ lc.arOn }}" lang="ar" style="border: 0; padding: 12px 22px; min-height: 46px; border-radius: 999px; font-weight: 800; font-size: 16px; box-shadow: 0 10px 16px -8px rgba(35,32,74,.3), inset 0 -5px 8px rgba(35,32,74,.12), inset 0 5px 8px rgba(255,255,255,.5); font-family: 'Tajawal', sans-serif; background: {{ lc.arBg }}; color: {{ lc.arFg }}">العربية</button>
</div>

<sc-if value="{{ lc.idle }}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; color: #4B4870; max-width: 640px">Letters float down slowly. Listen to the word, then tap the letter it starts with. There is no timer and nothing to lose, so it works well for a child and a grown-up together.</p>
<button type="button" onclick="{{ lc.start }}" style="align-self: flex-start; border: 0; padding: 14px 26px; min-height: 52px; border-radius: 999px; background: #FF6FA8; color: #23204A; font-weight: 800; font-size: 17px; box-shadow: 0 12px 16px -8px rgba(35,32,74,.35), inset 0 -6px 8px rgba(35,32,74,.16), inset 0 6px 8px rgba(255,255,255,.5)">Start catching</button>
</sc-if>

<sc-if value="{{ lc.playing }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 800; font-size: 14px; color: #4B4870">Tap the first letter of</span>
<span style="font-family: 'Baloo Bhaijaan 2', 'Fredoka', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.3">{{ lc.word }} <span style="font-weight: 500; font-size: 18px; color: #4B4870">{{ lc.gloss }}</span></span>
</div>
<span style="display: flex; align-items: center; gap: 8px; font-weight: 800"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="#FFC93C" stroke="#23204A" stroke-width="1.800" stroke-linejoin="round"><path d="M12 3l2.700 5.600 6.100.800-4.500 4.300 1.100 6.100L12 16.900 6.600 19.800l1.100-6.100L3.200 9.400l6.100-.800z"/></svg><span>Stars: {{ lc.stars }}</span></span>
</div>
<div dir="ltr" role="group" aria-label="Falling letters" style="position: relative; height: 340px; border-radius: 28px; background: #C4E4FC; overflow: hidden; box-shadow: inset 0 6px 10px rgba(35,32,74,.14)">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: #F4D9A0"></div>
<sc-for list="{{ lc.tiles }}" as="t" hint-placeholder-count="3">
<button type="button" data-lc onclick="{{ t.tap }}" style="position: absolute; top: 0; left: calc({{ t.left }}% - 42px); width: 84px; height: 84px; border: 0; padding: 0; border-radius: 28px; font-family: 'Baloo Bhaijaan 2', 'Fredoka', sans-serif; font-weight: 700; font-size: 46px; line-height: 1; touch-action: manipulation; transition: none; transform: translateY({{ t.y }}px); opacity: {{ t.op }}; background: {{ t.bg }}; color: {{ t.fg }}; box-shadow: 0 12px 16px -8px rgba(35,32,74,.35), inset 0 -7px 10px rgba(35,32,74,.16), inset 0 7px 10px rgba(255,255,255,.55)">{{ t.ch }}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<button type="button" onclick="{{ lc.hear }}" style="border: 0; display: flex; align-items: center; gap: 10px; padding: 12px 22px; min-height: 48px; border-radius: 999px; background: #3FA9F5; color: #23204A; font-weight: 800; font-size: 16px; box-shadow: 0 12px 16px -8px rgba(35,32,74,.35), inset 0 -6px 8px rgba(35,32,74,.16), inset 0 6px 8px rgba(255,255,255,.5)">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23204A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.500v5h3.500l4.500 4v-13l-4.500 4z"/><path d="M15.500 9a4 4 0 0 1 0 6M18 6.500a7.500 7.500 0 0 1 0 11"/></svg>
<span>Hear it again</span>
</button>
<button type="button" onclick="{{ lc.stop }}" style="border: 0; padding: 12px 22px; min-height: 48px; border-radius: 999px; background: #FBF3E4; color: #23204A; font-weight: 800; font-size: 16px; box-shadow: 0 10px 14px -8px rgba(35,32,74,.25), inset 0 -5px 8px rgba(35,32,74,.08), inset 0 5px 8px rgba(255,255,255,.7)">Finish</button>
<sc-if value="{{ lc.showHint }}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 999px; background: #FFE9A8; font-weight: 800">Look for <span style="font-family: 'Baloo Bhaijaan 2', 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.2">{{ lc.hintCh }}</span></span>
</sc-if>
</div>
<span role="status" aria-live="polite" style="font-weight: 800; min-height: 26px; color: {{ lc.msgColor }}">{{ lc.msg }}</span>
</sc-if>
</div>

<!-- SOUQ DASH (playable) -->
<div id="souq-dash" style="background: #FFFFFF; border-radius: 40px; padding: clamp(22px, 4vw, 36px); box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; scroll-margin-top: 24px; box-shadow: 0 30px 44px -16px rgba(35,32,74,.3), inset 0 -12px 18px rgba(35,32,74,.07), inset 0 12px 18px rgba(255,255,255,.9)">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h3 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.2">Souq Dash</h3>
<span style="padding: 6px 14px; border-radius: 999px; background: #FFD3C0; font-weight: 800; font-size: 14px">Ages 10 to 14</span>
</div>

<sc-if value="{{ g.idle }}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; color: #4B4870; max-width: 640px">Customers are on their way. Work out what each one owes, then tap the notes and coins to give the right change. Serve as many as you can in 90 seconds.</p>
<button type="button" onclick="{{ g.start }}" style="align-self: flex-start; border: 0; padding: 14px 26px; min-height: 52px; border-radius: 999px; background: #FF7A45; color: #23204A; font-weight: 800; font-size: 17px; box-shadow: 0 12px 16px -8px rgba(35,32,74,.35), inset 0 -6px 8px rgba(35,32,74,.16), inset 0 6px 8px rgba(255,255,255,.5)">Open the stall</button>
</sc-if>

<sc-if value="{{ g.playing }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<div style="padding: 10px 16px; min-width: 64px; border-radius: 20px; background: #FFC93C; text-align: center; box-shadow: inset 0 -5px 8px rgba(35,32,74,.14), inset 0 5px 8px rgba(255,255,255,.55)">
<div id="sd-time" style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">{{ g.time }}</div>
<div style="font-weight: 800; font-size: 12px">seconds</div>
</div>
<div style="padding: 10px 16px; min-width: 64px; border-radius: 20px; background: #2ED3A6; text-align: center; box-shadow: inset 0 -5px 8px rgba(35,32,74,.14), inset 0 5px 8px rgba(255,255,255,.5)">
<div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">{{ g.served }}</div>
<div style="font-weight: 800; font-size: 12px">served</div>
</div>
<div aria-hidden="true" style="flex: 1 1 200px; height: 22px; border-radius: 999px; background: #EADFC8; box-shadow: inset 0 5px 8px rgba(35,32,74,.16); overflow: hidden">
<div id="sd-bar" style="height: 100%; width: {{ g.barW }}; border-radius: 999px; background: #FF7A45; box-shadow: inset 0 -5px 7px rgba(35,32,74,.2), inset 0 5px 7px rgba(255,255,255,.4)"></div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px">
<div style="flex: 1 1 300px; min-width: 0; background: #FBF3E4; border-radius: 28px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 6px 10px rgba(35,32,74,.12)">
<span style="font-weight: 800; font-size: 14px; color: #4B4870">The customer buys</span>
<sc-for list="{{ g.lines }}" as="ln" hint-placeholder-count="2">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; line-height: 1.3">{{ ln.text }}</span>
</sc-for>
<span style="margin-top: 8px; font-weight: 800; font-size: 14px; color: #4B4870">and pays with</span>
<span style="align-self: flex-start; padding: 8px 22px; border-radius: 16px; background: #0B6B3A; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.3; box-shadow: 0 12px 16px -10px rgba(35,32,74,.4), inset 0 -6px 8px rgba(35,32,74,.28), inset 0 6px 8px rgba(255,255,255,.3)">{{ g.paid }}</span>
</div>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-weight: 800; font-size: 14px; color: #4B4870">Tap to count out the change</span>
<div role="group" aria-label="Notes and coins" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{ g.coins }}" as="cn" hint-placeholder-count="4">
<button type="button" onclick="{{ cn.tap }}" aria-label="{{ cn.aria }}" style="border: 0; padding: 0 8px; min-width: 64px; height: 60px; border-radius: 18px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #23204A; background: {{ cn.bg }}; box-shadow: 0 10px 14px -8px rgba(35,32,74,.3), inset 0 -5px 8px rgba(35,32,74,.14), inset 0 5px 8px rgba(255,255,255,.5)">{{ cn.label }}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px">
<span style="font-weight: 800">Your change:</span>
<span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.2">{{ g.give }}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" onclick="{{ g.submit }}" style="border: 0; padding: 12px 24px; min-height: 50px; border-radius: 999px; background: #0B6B3A; color: #FFFFFF; font-weight: 800; font-size: 17px; box-shadow: 0 12px 16px -8px rgba(35,32,74,.4), inset 0 -6px 8px rgba(35,32,74,.25), inset 0 6px 8px rgba(255,255,255,.35)">Give change</button>
<button type="button" onclick="{{ g.clear }}" style="border: 0; padding: 12px 24px; min-height: 50px; border-radius: 999px; background: #FBF3E4; color: #23204A; font-weight: 800; font-size: 17px; box-shadow: 0 10px 14px -8px rgba(35,32,74,.25), inset 0 -5px 8px rgba(35,32,74,.08), inset 0 5px 8px rgba(255,255,255,.7)">Clear</button>
</div>
<span role="status" aria-live="polite" style="font-weight: 800; min-height: 26px; color: {{ g.msgColor }}">{{ g.msg }}</span>
</div>
</div>
</sc-if>

<sc-if value="{{ g.over }}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.3">The stall is closed for the day.</span>
<span style="font-size: 19px">{{ g.result }}</span>
<span style="font-weight: 800; color: #0B6B3A">{{ g.best }}</span>
</div>
<button type="button" onclick="{{ g.start }}" style="align-self: flex-start; border: 0; padding: 14px 26px; min-height: 52px; border-radius: 999px; background: #FF7A45; color: #23204A; font-weight: 800; font-size: 17px; box-shadow: 0 12px 16px -8px rgba(35,32,74,.35), inset 0 -6px 8px rgba(35,32,74,.16), inset 0 6px 8px rgba(255,255,255,.5)">Play again</button>
</sc-if>
</div>
<div style="background: #FFFFFF; border-radius: 40px; padding: clamp(22px, 4vw, 36px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 36px; box-shadow: 0 30px 44px -16px rgba(35,32,74,.3), inset 0 -12px 18px rgba(35,32,74,.07), inset 0 12px 18px rgba(255,255,255,.9)">
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<h3 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.2">Weave your own pattern</h3>
<p style="margin: 0; color: #4B4870">A free-play game for every age. Tap a square to change its colour and build a pattern of your own.</p>
<p style="margin: 0; font-weight: 800; color: #0B6B3A">Try it: tap the squares.</p>
<button type="button" onclick="{{ clearWeave }}" style="align-self: flex-start; border: 0; padding: 12px 22px; min-height: 48px; border-radius: 999px; background: #FFC93C; color: #23204A; font-weight: 800; font-size: 16px; box-shadow: 0 12px 16px -8px rgba(35,32,74,.35), inset 0 -6px 8px rgba(35,32,74,.16), inset 0 6px 8px rgba(255,255,255,.6)">Start again</button>
</div>
<div dir="ltr" style="flex: 1 1 340px; min-width: 0; max-width: 460px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; padding: 16px; border-radius: 28px; background: #FBF3E4; box-shadow: inset 0 6px 10px rgba(35,32,74,.14)">
<sc-for list="{{ cells }}" as="c" hint-placeholder-count="24">
<button type="button" onclick="{{ c.tap }}" aria-label="{{ c.label }}" style="border: 0; padding: 0; aspect-ratio: 1; min-height: 44px; border-radius: 14px; background: {{ c.bg }}; box-shadow: 0 6px 8px -4px rgba(35,32,74,.3), inset 0 -4px 6px rgba(35,32,74,.18), inset 0 4px 6px rgba(255,255,255,.4)"></button>
</sc-for>
</div>
</div>
</section>

<!-- STORIES -->
<section id="stories" style="max-width: 1180px; margin: 0 auto; padding: 56px clamp(20px, 5vw, 48px); display: flex; flex-direction: column; gap: 32px">
<h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(32px, 4vw, 46px); line-height: 1.1">What families say</h2>
<div style="display: flex; flex-wrap: wrap; gap: 28px">
<figure style="margin: 0; flex: 1 1 300px; min-width: 0; background: #FFC93C; border-radius: 36px; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; transform: rotate(-1.5deg); box-shadow: 0 26px 40px -16px rgba(35,32,74,.32), inset 0 -12px 18px rgba(35,32,74,.14), inset 0 12px 18px rgba(255,255,255,.55)">
<blockquote style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 22px; line-height: 1.3">"We sing the letter songs together every morning. She points at letters on shop signs now."</blockquote>
<figcaption style="margin-top: auto; display: flex; align-items: center; gap: 12px; font-weight: 800">
<span aria-hidden="true" style="width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; box-shadow: inset 0 -5px 8px rgba(35,32,74,.14)"></span>
<span>[Parent name], parent of a [age]-year-old</span>
</figcaption>
</figure>
<figure style="margin: 0; flex: 1 1 300px; min-width: 0; background: #2ED3A6; border-radius: 36px; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; transform: rotate(1deg); box-shadow: 0 26px 40px -16px rgba(35,32,74,.32), inset 0 -12px 18px rgba(35,32,74,.14), inset 0 12px 18px rgba(255,255,255,.5)">
<blockquote style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 22px; line-height: 1.3">"My falcon game has three levels and my little brother can't beat the last one."</blockquote>
<figcaption style="margin-top: auto; display: flex; align-items: center; gap: 12px; font-weight: 800">
<span aria-hidden="true" style="width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; box-shadow: inset 0 -5px 8px rgba(35,32,74,.14)"></span>
<span>[Student name], [age]</span>
</figcaption>
</figure>
<figure style="margin: 0; flex: 1 1 300px; min-width: 0; background: #FF6FA8; border-radius: 36px; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; transform: rotate(-1deg); box-shadow: 0 26px 40px -16px rgba(35,32,74,.32), inset 0 -12px 18px rgba(35,32,74,.16), inset 0 12px 18px rgba(255,255,255,.5)">
<blockquote style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 22px; line-height: 1.3">"The lessons are short, so I do one on the bus and one after football."</blockquote>
<figcaption style="margin-top: auto; display: flex; align-items: center; gap: 12px; font-weight: 800">
<span aria-hidden="true" style="width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; box-shadow: inset 0 -5px 8px rgba(35,32,74,.14)"></span>
<span>[Student name], [age]</span>
</figcaption>
</figure>
</div>
</section>

<div aria-hidden="true" style="max-width: 1180px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 48px); box-sizing: border-box"><svg width="100%" height="30" style="display: block"><defs><pattern id="najd2" width="60" height="30" patternUnits="userSpaceOnUse"><path d="M0 30L15 4l15 26z" fill="#0B6B3A"/><path d="M30 30L45 4l15 26z" fill="#FFC93C"/></pattern></defs><rect width="100%" height="30" fill="url(#najd2)"/></svg></div>

<!-- ENROLL -->
<section id="enroll" style="max-width: 1180px; margin: 0 auto; padding: 56px clamp(20px, 5vw, 48px) 72px">
<div style="position: relative; background: {{accent}}; color: #FFFFFF; border-radius: 48px; padding: clamp(32px, 6vw, 72px); display: flex; flex-wrap: wrap; align-items: center; gap: 40px; box-shadow: 0 40px 56px -20px rgba(35,32,74,.5), inset 0 -18px 26px rgba(35,32,74,.3), inset 0 18px 26px rgba(255,255,255,.3)">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(34px, 4.5vw, 54px); line-height: 1.05">Ready for the first quest?</h2>
<p style="margin: 0; font-size: 19px; max-width: 460px">Enroll today and open the first lesson of every course. Free for 10 days, then 24 SAR a month.</p>
</div>
<form action="#enroll" style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; color: #23204A; border-radius: 32px; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 22px 30px -14px rgba(35,32,74,.45), inset 0 -8px 12px rgba(35,32,74,.08), inset 0 8px 12px rgba(255,255,255,.9)">
<label for="enroll-email" style="font-weight: 800">Parent or guardian email</label>
<input id="enroll-email" type="email" placeholder="name@example.com" autocomplete="email" style="border: 0; outline-offset: 3px; padding: 16px 18px; min-height: 24px; border-radius: 18px; background: #FBF3E4; font-size: 17px; color: #23204A; box-shadow: inset 0 5px 8px rgba(35,32,74,.14)">
<button type="button" onclick="{{ enroll }}" style="border: 0; padding: 16px 24px; min-height: 56px; border-radius: 999px; background: #FFC93C; color: #23204A; font-weight: 800; font-size: 18px; box-shadow: 0 14px 20px -10px rgba(35,32,74,.4), inset 0 -7px 10px rgba(35,32,74,.16), inset 0 7px 10px rgba(255,255,255,.6)">Enroll now</button>
<span style="font-size: 14px; color: #4B4870">No card needed to start. Cancel any time.</span>
<span role="status" aria-live="polite" style="font-weight: 800; min-height: 24px; color: {{ enrollMsg.color }}">{{ enrollMsg.text }}</span>
</form>
</div>
</section>
