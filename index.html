<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sadu: playful learning for children</title>
<meta name="description" content="Sadu: a free, bilingual (English and Arabic) learning platform for children aged 3 to 14: phonics, maths, science, coding, AI, stories, Discover Saudi Arabia and games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Tajawal:wght@800&family=Baloo+Bhaijaan+2:wght@500;600;700&display=swap">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

</head>
<body>
<div id="app"></div>
<noscript>This page needs JavaScript to show its content.</noscript>

<template id="page">
<div style="font-family: 'Nunito', system-ui, sans-serif; color: #23204A; background: #FBF3E4; font-size: 17px; line-height: 1.5; overflow: hidden">

<!-- NAV -->
<header style="max-width: 1180px; margin: 0 auto; padding: 24px clamp(20px, 5vw, 48px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="#top" style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<span style="width: 48px; height: 48px; border-radius: 16px; background: #FFC93C; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 16px -6px rgba(35,32,74,.3), inset 0 -5px 8px rgba(35,32,74,.16), inset 0 5px 8px rgba(255,255,255,.6)">
<svg aria-hidden="true" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M24 8L42 40H6z" fill="#B3261E" stroke="#B3261E" stroke-width="3"/><path d="M19.5 16h9l1.7 3H17.8z" fill="#FFFFFF"/><path d="M16.1 22h15.8l1.7 3H14.4z" fill="#FFFFFF"/><circle cx="19.5" cy="31" r="1.6" fill="#FFFFFF"/><circle cx="28.5" cy="31" r="1.6" fill="#FFFFFF"/><path d="M19 35q5 4 10 0" stroke="#FFFFFF" stroke-width="2.2"/></svg>
</span>
<span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px">Sadu</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 700">
<a href="#courses" style="padding: 10px 16px; min-height: 24px; border-radius: 999px">Courses</a>
<a href="#phonics" style="padding: 10px 16px; min-height: 24px; border-radius: 999px">Phonics</a>
<a href="#progress" style="padding: 10px 16px; min-height: 24px; border-radius: 999px">Progress</a>
<a href="#games" style="padding: 10px 16px; min-height: 24px; border-radius: 999px">Games</a>
<a href="#stories" style="padding: 10px 16px; min-height: 24px; border-radius: 999px">Inside Sadu</a>
<a href="learn.html" style="padding: 10px 16px; min-height: 24px; border-radius: 999px; background: #FFC93C">My courses</a>
<a href="ar.html" lang="ar" style="padding: 10px 16px; min-height: 24px; border-radius: 999px; font-family: 'Tajawal', sans-serif; font-weight: 800">العربية</a>
<a href="#enroll" style="padding: 12px 22px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 10px 16px -6px rgba(35,32,74,.25), inset 0 -5px 8px rgba(35,32,74,.08), inset 0 5px 8px rgba(255,255,255,.9)">Start</a>
</nav>
</header>

<!-- HERO -->
<section id="top" style="max-width: 1180px; margin: 0 auto; padding: 40px clamp(20px, 5vw, 48px) 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<span style="align-self: flex-start; padding: 8px 16px; border-radius: 999px; background: #2ED3A6; font-weight: 800; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; box-shadow: 0 8px 12px -6px rgba(35,32,74,.3), inset 0 -4px 6px rgba(35,32,74,.14), inset 0 4px 6px rgba(255,255,255,.5)">For curious kids aged 3 to 14 · English and Arabic</span>
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(42px, 6vw, 72px); line-height: 1.02; letter-spacing: -.01em">Learning that feels like play.</h1>
<p style="margin: 0; font-size: 20px; color: #4B4870; max-width: 520px">Saqr the falcon guides your child through short lessons in phonics, Arabic, English, maths, science, art, coding and AI, with stories, a pet to raise, quests across Saudi Arabia and games.</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<a href="learn.html" style="padding: 16px 30px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-weight: 800; font-size: 18px; box-shadow: 0 16px 24px -10px rgba(35,32,74,.45), inset 0 -7px 10px rgba(35,32,74,.25), inset 0 7px 10px rgba(255,255,255,.35)">Start learning free</a>
<a href="#courses" style="padding: 16px 30px; border-radius: 999px; background: #FFFFFF; font-weight: 800; font-size: 18px; box-shadow: 0 16px 24px -10px rgba(35,32,74,.25), inset 0 -7px 10px rgba(35,32,74,.08), inset 0 7px 10px rgba(255,255,255,.9)">Browse courses</a>
</div>
</div>

<div aria-hidden="true" style="flex: 1 1 380px; min-width: 0; display: flex; justify-content: center">
<div style="position: relative; width: 420px; max-width: 100%; height: 440px">
<div style="position: absolute; left: 40px; top: 50px; width: 300px; height: 330px; border-radius: 48px; background: {{accent}}; transform: rotate(-6deg); box-shadow: 0 34px 48px -16px rgba(35,32,74,.45), inset 0 -16px 24px rgba(35,32,74,.28), inset 0 16px 24px rgba(255,255,255,.35); box-sizing: border-box; padding: 34px; color: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
<span style="font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; opacity: .9">Today's six</span>
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 34px; line-height: 1.1">Six short activities picked for you</span>
<span style="font-size: 16px; opacity: .92">Lessons, a story and a Discover quest, new every day.</span>
<span style="margin-top: auto; align-self: flex-start; padding: 10px 18px; border-radius: 999px; background: #FFC93C; color: #23204A; font-weight: 800; box-shadow: inset 0 -4px 6px rgba(35,32,74,.16), inset 0 4px 6px rgba(255,255,255,.55)">~15 min</span>
</div>
<div style="position: absolute; right: 0; top: 0; width: 120px; height: 120px; border-radius: 40px; background: #FFC93C; transform: rotate(10deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 22px 30px -12px rgba(35,32,74,.4), inset 0 -10px 14px rgba(35,32,74,.16), inset 0 10px 14px rgba(255,255,255,.6)">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#23204A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>
</div>
<div style="position: absolute; right: 10px; bottom: 30px; width: 136px; height: 136px; border-radius: 50%; background: #2ED3A6; display: flex; align-items: center; justify-content: center; box-shadow: 0 22px 30px -12px rgba(35,32,74,.4), inset 0 -10px 14px rgba(35,32,74,.16), inset 0 10px 14px rgba(255,255,255,.55)">
<svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#23204A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
</div>
<div style="position: absolute; left: 0; bottom: 0; width: 110px; height: 110px; border-radius: 36px; background: #FF7A45; transform: rotate(-12deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 22px 30px -12px rgba(35,32,74,.4), inset 0 -10px 14px rgba(35,32,74,.18), inset 0 10px 14px rgba(255,255,255,.5)">
<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#23204A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c0-4 .4-7 1-10"/><path d="M13 11c-1-3-4-4-7-3M13 11c1-3 4-4 7-3M13 11c-3-.6-6 .4-7 3.4M13 11c3-.6 6 .4 7 3.4M13 11c0-3-1-5-3-6"/></svg>
</div>
<div style="position: absolute; left: 10px; top: 10px; width: 64px; height: 64px; border-radius: 50%; background: #FF6FA8; box-shadow: 0 14px 20px -8px rgba(35,32,74,.4), inset 0 -7px 10px rgba(35,32,74,.16), inset 0 7px 10px rgba(255,255,255,.5)"></div>
</div>
</div>
</section>

<div aria-hidden="true" style="max-width: 1180px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 48px); box-sizing: border-box"><svg width="100%" height="30" style="display: block"><defs><pattern id="najd1" width="60" height="30" patternUnits="userSpaceOnUse"><path d="M0 30L15 4l15 26z" fill="#0B6B3A"/><path d="M30 30L45 4l15 26z" fill="#FFC93C"/></pattern></defs><rect width="100%" height="30" fill="url(#najd1)"/></svg></div>

<!-- COURSES -->
<section id="courses" style="max-width: 1180px; margin: 0 auto; padding: 56px clamp(20px, 5vw, 48px); display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-family: 'Fredoka', 'Tajawal', sans-serif; font-weight: 700; font-size: clamp(32px, 4vw, 46px); line-height: 1.15">Courses</h2><p style="margin: 0; color: #4B4870; font-size: 19px; max-width: 640px">Every course is a path of short lessons with Saqr. Pick one, or let Today's six choose for you.</p></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px">
<sc-for list="{{ realCourses }}" as="c"><article style="border-radius: 28px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; box-shadow: 0 22px 36px -18px rgba(35,32,74,.3), inset 0 -8px 14px rgba(35,32,74,.06); border-top: 8px solid {{ c.color }}"><h3 style="margin: 0; font-family: 'Fredoka', 'Tajawal', sans-serif; font-size: 24px">{{ c.name }}</h3><span style="align-self: flex-start; padding: 4px 12px; border-radius: 999px; background: {{ c.tint }}; font-weight: 800; font-size: 14px">{{ c.age }} · {{ c.count }} lessons</span><p style="margin: 0; color: #4B4870">{{ c.sample }}</p><a href="learn.html" style="margin-top: auto; align-self: flex-start; padding: 10px 18px; border-radius: 999px; background: #23204A; color: #FFFFFF; font-weight: 800; text-decoration: none">Open course</a></article></sc-for>
</div>
</section>

<!-- PROGRESS -->
<section id="progress" style="max-width: 1180px; margin: 0 auto; padding: 56px clamp(20px, 5vw, 48px); display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(32px, 4vw, 46px); line-height: 1.1">See every step you take</h2>
<p style="margin: 0; color: #4B4870; font-size: 19px; max-width: 480px">Each finished lesson fills the bar and earns points. Parents get the same view, so nobody has to ask "what did you do today?"</p>
<p style="margin: 0; font-weight: 800; color: #0B6B3A">Try it: tap a lesson to mark it done.</p>
<a href="learn.html#report" style="align-self: flex-start; padding: 12px 22px; border-radius: 999px; background: #FFC93C; font-weight: 800; box-shadow: 0 12px 16px -8px rgba(35,32,74,.35), inset 0 -6px 8px rgba(35,32,74,.16), inset 0 6px 8px rgba(255,255,255,.6)">Open the family report</a>
<div style="margin-top: 10px; display: flex; flex-direction: column; gap: 10px; max-width: 460px">
<span style="font-weight: 800; font-size: 15px; color: #4B4870">What the parent sees on their phone</span>
<div role="status" aria-live="polite" style="background: #23204A; color: #FFFFFF; border-radius: 28px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 24px 34px -14px rgba(35,32,74,.5), inset 0 -8px 12px rgba(0,0,0,.35), inset 0 8px 12px rgba(255,255,255,.18)">
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="flex: none; width: 34px; height: 34px; border-radius: 12px; background: #FFC93C; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M24 8L42 40H6z" fill="#B3261E" stroke="#B3261E" stroke-width="3"/><path d="M19.5 16h9l1.7 3H17.8z" fill="#FFFFFF"/><path d="M16.1 22h15.8l1.7 3H14.4z" fill="#FFFFFF"/><circle cx="19.5" cy="31" r="1.6" fill="#FFFFFF"/><circle cx="28.5" cy="31" r="1.6" fill="#FFFFFF"/><path d="M19 35q5 4 10 0" stroke="#FFFFFF" stroke-width="2.2"/></svg></span>
<span style="font-weight: 800">Sadu</span>
<span style="margin-inline-start: auto; font-size: 14px; color: #D6D3F0">now</span>
</div>
<span style="font-weight: 800; font-size: 18px">{{ note.title }}</span>
<span style="font-size: 16px; color: #ECEAFB">{{ note.body }}</span>
</div>
</div>
</div>

<div style="flex: 1 1 420px; min-width: 0; background: #FFFFFF; border-radius: 40px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 30px 44px -16px rgba(35,32,74,.3), inset 0 -12px 18px rgba(35,32,74,.07), inset 0 12px 18px rgba(255,255,255,.9)">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column">
<span style="font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #4B4870">Code a Falcon</span>
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px">Week 1</span>
</div>
<div style="display: flex; gap: 12px">
<div style="padding: 10px 16px; border-radius: 20px; background: #FFC93C; text-align: center; box-shadow: inset 0 -5px 8px rgba(35,32,74,.14), inset 0 5px 8px rgba(255,255,255,.55)">
<div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">{{ xp }}</div>
<div style="font-weight: 800; font-size: 12px">points</div>
</div>
<div style="padding: 10px 16px; border-radius: 20px; background: #2ED3A6; text-align: center; box-shadow: inset 0 -5px 8px rgba(35,32,74,.14), inset 0 5px 8px rgba(255,255,255,.5)">
<div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">{{ doneText }}</div>
<div style="font-weight: 800; font-size: 12px">lessons</div>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 15px">
<span>Progress</span><span aria-live="polite">{{ pct }}</span>
</div>
<div role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ pctNum }}" style="height: 26px; border-radius: 999px; background: #EADFC8; box-shadow: inset 0 5px 8px rgba(35,32,74,.16); overflow: hidden">
<div style="height: 100%; width: {{ pct }}; border-radius: 999px; background: {{accent}}; transition: width .35s ease; box-shadow: inset 0 -6px 8px rgba(35,32,74,.25), inset 0 6px 8px rgba(255,255,255,.4)"></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<button type="button" onclick="{{ l1.toggle }}" aria-pressed="{{ l1.done }}" style="border: 0; text-align: left; display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 60px; border-radius: 22px; background: {{ l1.bg }}; color: #23204A; font-size: 17px; font-weight: 700; box-shadow: 0 10px 14px -8px rgba(35,32,74,.25), inset 0 -5px 8px rgba(35,32,74,.08), inset 0 5px 8px rgba(255,255,255,.7)">
<span style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: {{ l1.dot }}; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 3px 5px rgba(35,32,74,.18)"><sc-if value="{{ l1.done }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if></span>
<span>Meet your falcon</span>
</button>
<button type="button" onclick="{{ l2.toggle }}" aria-pressed="{{ l2.done }}" style="border: 0; text-align: left; display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 60px; border-radius: 22px; background: {{ l2.bg }}; color: #23204A; font-size: 17px; font-weight: 700; box-shadow: 0 10px 14px -8px rgba(35,32,74,.25), inset 0 -5px 8px rgba(35,32,74,.08), inset 0 5px 8px rgba(255,255,255,.7)">
<span style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: {{ l2.dot }}; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 3px 5px rgba(35,32,74,.18)"><sc-if value="{{ l2.done }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if></span>
<span>Make it fly</span>
</button>
<button type="button" onclick="{{ l3.toggle }}" aria-pressed="{{ l3.done }}" style="border: 0; text-align: left; display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 60px; border-radius: 22px; background: {{ l3.bg }}; color: #23204A; font-size: 17px; font-weight: 700; box-shadow: 0 10px 14px -8px rgba(35,32,74,.25), inset 0 -5px 8px rgba(35,32,74,.08), inset 0 5px 8px rgba(255,255,255,.7)">
<span style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: {{ l3.dot }}; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 3px 5px rgba(35,32,74,.18)"><sc-if value="{{ l3.done }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if></span>
<span>Teach it to dive</span>
</button>
<button type="button" onclick="{{ l4.toggle }}" aria-pressed="{{ l4.done }}" style="border: 0; text-align: left; display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 60px; border-radius: 22px; background: {{ l4.bg }}; color: #23204A; font-size: 17px; font-weight: 700; box-shadow: 0 10px 14px -8px rgba(35,32,74,.25), inset 0 -5px 8px rgba(35,32,74,.08), inset 0 5px 8px rgba(255,255,255,.7)">
<span style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: {{ l4.dot }}; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 3px 5px rgba(35,32,74,.18)"><sc-if value="{{ l4.done }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if></span>
<span>Paint the desert sky</span>
</button>
<button type="button" onclick="{{ l5.toggle }}" aria-pressed="{{ l5.done }}" style="border: 0; text-align: left; display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 60px; border-radius: 22px; background: {{ l5.bg }}; color: #23204A; font-size: 17px; font-weight: 700; box-shadow: 0 10px 14px -8px rgba(35,32,74,.25), inset 0 -5px 8px rgba(35,32,74,.08), inset 0 5px 8px rgba(255,255,255,.7)">
<span style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: {{ l5.dot }}; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 3px 5px rgba(35,32,74,.18)"><sc-if value="{{ l5.done }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if></span>
<span>Build the mini game</span>
</button>
</div>
</div>
</section>

<!-- PHONICS -->
<section id="phonics" style="max-width: 1180px; margin: 0 auto; padding: 56px clamp(20px, 5vw, 48px); display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(32px, 4vw, 46px); line-height: 1.2">Phonics: learn and play</h2>
<p style="margin: 0; color: #4B4870; font-size: 19px; max-width: 600px">Letter sounds in English and Arabic. First meet the sound, then play with it.</p>
</div>
<div role="group" aria-label="Choose a language" style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" onclick="{{ ph.setEn }}" aria-pressed="{{ ph.enOn }}" lang="en" style="border: 0; padding: 12px 22px; min-height: 46px; border-radius: 999px; font-weight: 800; font-size: 16px; box-shadow: 0 10px 16px -8px rgba(35,32,74,.3), inset 0 -5px 8px rgba(35,32,74,.12), inset 0 5px 8px rgba(255,255,255,.5); font-family: 'Nunito', sans-serif; background: {{ ph.enBg }}; color: {{ ph.enFg }}">English</button>
<button type="button" onclick="{{ ph.setAr }}" aria-pressed="{{ ph.arOn }}" lang="ar" style="border: 0; padding: 12px 22px; min-height: 46px; border-radius: 999px; font-weight: 800; font-size: 16px; box-shadow: 0 10px 16px -8px rgba(35,32,74,.3), inset 0 -5px 8px rgba(35,32,74,.12), inset 0 5px 8px rgba(255,255,255,.5); font-family: 'Tajawal', sans-serif; background: {{ ph.arBg }}; color: {{ ph.arFg }}">العربية</button>

,32,74,.06)"><span aria-hidden="true" style="font-size: 40px; line-height: 1">🤖</span><h3 style="margin: 0; font-family: 'Fredoka', 'Tajawal', sans-serif; font-size: 21px">AI Lab</h3><p style="margin: 0; color: #4B4870">Teach a robot with colours, words or numbers and see how machine learning works.</p></article><article style="border-radius: 28px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; box-shadow: 0 22px 36px -18px rgba(35,32,74,.3), inset 0 -8px 14px rgba(35,32,74,.06)"><span aria-hidden="true" style="font-size: 40px; line-height: 1">🚣</span><h3 style="margin: 0; font-family: 'Fredoka', 'Tajawal', sans-serif; font-size: 21px">Sadu Bay (3D)</h3><p style="margin: 0; color: #4B4870">A cozy fishing game in 3D where every catch is a small lesson.</p></article><article style="border-radius: 28px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; box-shadow: 0 22px 36px -18px rgba(35,32,74,.3), inset 0 -8px 14px rgba(35,32,74,.06)"><span aria-hidden="true" style="font-size: 40px; line-height: 1">📚</span><h3 style="margin: 0; font-family: 'Fredoka', 'Tajawal', sans-serif; font-size: 21px">Stories</h3><p style="margin: 0; color: #4B4870">Illustrated stories read aloud, each with questions and a sticker.</p></article><article style="border-radius: 28px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; box-shadow: 0 22px 36px -18px rgba(35,32,74,.3), inset 0 -8px 14px rgba(35,32,74,.06)"><span aria-hidden="true" style="font-size: 40px; line-height: 1">🤔</span><h3 style="margin: 0; font-family: 'Fredoka', 'Tajawal', sans-serif; font-size: 21px">Help when stuck</h3><p style="margin: 0; color: #4B4870">Hints, a worked step, tap-a-word meanings and review days so learning sticks.</p></article><article style="border-radius: 28px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; box-shadow: 0 22px 36px -18px rgba(35,32,74,.3), inset 0 -8px 14px rgba(35,32,74,.06)"><span aria-hidden="true" style="font-size: 40px; line-height: 1">👪</span><h3 style="margin: 0; font-family: 'Fredoka', 'Tajawal', sans-serif; font-size: 21px">For parents and teachers</h3><p style="margin: 0; color: #4B4870">A Family report, a daily time limit, worksheets, a lesson editor and a teacher guide.</p></article></div>
