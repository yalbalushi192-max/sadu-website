<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sadu Bay</title>
<meta name="theme-color" content="#2C8FCB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+Bhaijaan+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#23204A;--ink-2:#4B4870;--sand:#F6E7C1;--card:#FFFFFF;--accent:#FFB020;--green:#2E9E6B;--red:#E5534B}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1E6F9F;color:var(--ink);font-family:'Nunito','Baloo Bhaijaan 2',system-ui,sans-serif}
  [dir=rtl] body{font-family:'Baloo Bhaijaan 2','Nunito',system-ui,sans-serif}
  .wrap{position:relative;max-width:1100px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom))}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--card);font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .back{color:var(--ink);text-decoration:none}
  .spacer{flex:1}
  .stage{position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
  .controls{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:12px;pointer-events:none}
  .btn{pointer-events:auto;border:0;border-radius:999px;padding:16px 26px;font:inherit;font-weight:800;font-size:19px;color:#fff;background:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.25);cursor:pointer;min-height:56px;user-select:none;-webkit-user-select:none;touch-action:none}
  .btn.go{background:var(--green)}.btn.warm{background:var(--accent);color:var(--ink)}.btn.light{background:#fff;color:var(--ink)}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:92%;text-align:center;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.92);font-weight:800;pointer-events:none}
  .meter{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);width:min(420px,86%);height:26px;border-radius:999px;background:rgba(255,255,255,.9);overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .meter .zone{position:absolute;top:0;bottom:0;background:#9BE3B9}
  .meter .mark{position:absolute;top:-2px;bottom:-2px;width:10px;margin-left:-5px;border-radius:6px;background:var(--ink)}
  .meter .fillbar{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
  .progress{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:min(420px,86%);height:10px;border-radius:999px;background:rgba(255,255,255,.5);overflow:hidden}
  .progress span{display:block;height:100%;background:var(--green)}
  .layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,40,70,.45)}
  .card{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--card);border-radius:28px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.3)}
  .card h2{margin:0;font-family:'Fredoka','Baloo Bhaijaan 2',sans-serif;font-size:26px}
  .card p{margin:0;color:var(--ink-2);font-size:17px;line-height:1.5}
  .big{font-size:64px;line-height:1}
  .names{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:20px}
  .names span{padding:6px 12px;border-radius:12px;background:#EEF6FF}
  .opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
  .opts .btn{flex:1 1 90px;font-size:24px;background:#fff;color:var(--ink);border:3px solid #E6DFCF;box-shadow:0 5px 0 #E6DFCF}
  .opts .btn.ok{background:#DDF5E7;border-color:var(--green)}.opts .btn.no{background:#FDE3E1;border-color:var(--red)}
  .q{font-family:'Fredoka','Baloo Bhaijaan 2',sans-serif;font-size:30px;font-weight:700;margin:0}
  .basket{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:100%}
  .basket span{aspect-ratio:1;border-radius:10px;background:#F1ECE0;display:flex;align-items:center;justify-content:center;font-size:20px}
  [hidden]{display:none!important}
  @media (max-width:520px){.btn{padding:14px 20px;font-size:17px}.pill{padding:6px 10px;font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="pill back" id="back" href="learn.html">‹ Sadu</a>
    <span class="pill" id="title">🚣 Sadu Bay</span>
    <span class="spacer"></span>
    <span class="pill" id="clock" aria-live="polite">☀️</span>
    <span class="pill" id="creel">🧺 0/8</span>
    <span class="pill" id="coins">🪙 0</span>
  </div>
  <div class="stage" id="stage">
    <canvas id="sea" aria-label="Sadu Bay"></canvas>
    <div class="hint" id="hint"></div>
    <div class="progress" id="progress" hidden><span></span></div>
    <div class="meter" id="meter" hidden><div class="zone"></div><div class="fillbar"></div><div class="mark"></div></div>
    <div class="controls"><button type="button" class="btn go" id="action" hidden></button></div>
    <div class="layer" id="layer" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
  </div>
</div>
<script src="js/bay.js"></script>
</body>
</html>
